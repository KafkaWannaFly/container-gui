<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Container GUI — Compose group detail</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    --void:#08090a; --carbon:#0f1011; --obsidian:#161718; --graphite:#23252a; --smoke:#383b3f;
    --ash:#62666d; --fog:#8a8f98; --mist:#d0d6e0; --bone:#e5e5e6; --paper:#fff;
    --lime:#e4f222; --green:#27a644; --coral:#eb5757; --teal:#02b8cc; --violet:#6366f1; --lav:#8b5cf6;
    --amber:#d9a441;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--void); color:var(--mist);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-feature-settings:'cv01' 1,'ss03' 1,'zero' 1;
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-.013em}
  .app{display:flex;min-height:100vh}
  .side{
    width:224px;flex:0 0 224px;height:100vh;position:sticky;top:0;
    background:var(--carbon);border-right:1px solid var(--graphite);
    padding:14px 10px;display:flex;flex-direction:column;gap:2px;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;color:var(--paper);font-weight:510;font-size:15px;letter-spacing:-.011em}
  .brand svg{display:block}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;
    color:var(--mist);font-size:13px;cursor:pointer;border:1px solid transparent;user-select:none;
  }
  .nav-item:hover{background:var(--obsidian)}
  .nav-item.active{background:var(--obsidian);border-color:var(--graphite);color:var(--paper)}
  .side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--graphite);color:var(--ash);display:flex;justify-content:space-between;align-items:center}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ---- detail header ---- */
  .head{
    position:sticky;top:0;z-index:5;background:var(--void);
    border-bottom:1px solid var(--graphite);padding:16px 24px 0;
  }
  .crumbs{display:flex;align-items:center;gap:6px;color:var(--ash);font-size:12px;margin-bottom:10px}
  .crumbs .link{cursor:pointer}
  .crumbs .link:hover{color:var(--mist)}
  .head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:510;color:var(--paper);letter-spacing:-.014em;white-space:nowrap;flex-wrap:wrap}
  .sub{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .copyable{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ash)}
  .copyable:hover{color:var(--mist)}
  .stats{display:flex;gap:28px;flex-wrap:wrap;padding:14px 0 12px}
  .stat .k{font-size:12px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .stat .v{font-size:15px;color:var(--bone);font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.013em}
  .stat .v small{font-size:12px;color:var(--ash);margin-left:5px}
  .run-bar{display:flex;gap:2px;margin-top:6px}
  .run-bar span{width:14px;height:4px;border-radius:2px}

  /* ---- body ---- */
  .page{padding:20px 24px 28px;max-width:1200px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--carbon);border:1px solid var(--graphite);border-radius:12px;padding:16px}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .section-title{font-size:12px;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;margin:0}
  .sec-head{cursor:pointer;user-select:none;border-radius:4px}
  .sec-head.closed{margin-bottom:0}
  .sec-head:hover .section-title{color:var(--mist)}
  .sec-head:focus-visible{outline:1px solid var(--smoke);outline-offset:4px}
  .sec-chev{font-size:12px;color:var(--ash);transition:transform .15s}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .muted{color:var(--fog)}
  .dim{color:var(--ash)}
  .fs12{font-size:12px}
  .row-flex{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* ---- dependency graph ---- */
  .dag-wrap{overflow:auto;padding:4px 2px 2px}
  .dag{position:relative;margin:0 auto}
  .dag svg{position:absolute;inset:0;overflow:visible}
  .dag-node{
    position:absolute;display:flex;flex-direction:column;justify-content:center;gap:2px;
    background:var(--obsidian);border:1px solid var(--graphite);border-radius:6px;padding:0 10px;cursor:pointer;
    transition:border-color .12s, opacity .12s;
  }
  .dag-node:hover, .dag-node.on{border-color:var(--smoke)}
  .dag-node.off{opacity:.45}
  .dag-node .nm{display:flex;align-items:center;gap:8px;color:var(--paper);font-size:13px}
  .dag-col-h{position:absolute;top:-2px;font-size:12px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em}

  /* ---- logs ---- */
  pre.logs{
    margin:0;background:var(--void);border:1px solid var(--graphite);border-radius:8px;
    padding:12px 0;height:calc(100vh - 470px);min-height:320px;overflow:auto;color:var(--mist);
    font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.75;letter-spacing:-.013em;
  }
  .lg-row{padding:0 12px;display:flex;gap:10px}
  .lg-row > .msg{flex:1;min-width:0}
  .lg-ts{color:var(--ash);cursor:pointer;flex:0 0 auto}
  .lg-ts:hover{color:var(--mist);text-decoration:underline}
  .lg-tag{flex:0 0 92px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid;padding-left:8px}
  .lg-tag:hover{text-decoration:underline}
  .lg-lvl{flex:0 0 46px}
  .lg-error{color:var(--coral)}
  .lg-warn{color:var(--amber)}
  .lg-info{color:var(--mist)}
  .lg-debug{color:var(--ash)}
  .lg-event{color:var(--fog);background:rgba(255,255,255,.025)}
  .lg-event .msg{font-style:italic}
  .lg-near{background:rgba(2,184,204,.07)}
  .lg-anchor{background:rgba(2,184,204,.16)}
  .hl{background:rgba(228,242,34,.22);color:var(--paper);border-radius:2px}
  .lg-split{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(360px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
  .lg-col{display:flex;flex-direction:column;min-width:0;background:var(--void);border:1px solid var(--graphite);border-radius:8px;overflow:hidden}
  .lg-col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--graphite);font-size:13px;white-space:nowrap}
  .lg-col pre.logs{border:0;border-radius:0;height:calc(100vh - 506px)}
  .lg-col-h .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .lg-col-h .opts{display:inline-flex;gap:2px;flex:none}
  .lg-col-h .opts .ant-btn{color:var(--ash)}
  .lg-col-h .opts .ant-btn.on{color:var(--lime)}

  /* ---- scaling, profiles, impact ---- */
  .stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--graphite);border-radius:6px;padding:0 2px;margin-left:4px}
  .stepper .mono{min-width:22px;text-align:center;color:var(--bone)}
  .stepper .ant-btn{height:20px;width:20px;min-width:20px}
  .inactive{margin-top:12px;padding-top:10px;border-top:1px dashed var(--graphite)}
  .inactive-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px}
  .inactive-row:hover{background:var(--obsidian)}
  .impact{border:1px solid var(--graphite);border-radius:6px;padding:4px 0}
  .impact-row{display:flex;align-items:center;gap:8px;padding:4px 8px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:9999px;cursor:pointer;
    border:1px solid var(--graphite);background:rgba(255,255,255,.03);color:var(--mist);font-size:12px;user-select:none;
  }
  .chip:hover{border-color:var(--smoke)}
  .chip.off{color:var(--ash);background:transparent}
  .chip.off .dot{background:transparent !important}
  .chip .dot{width:8px;height:8px;border-radius:99px;border:2px solid}
  .chip .n{color:var(--ash)}
  .chip .dots{display:inline-flex;gap:3px}
  .chip .dots i{width:6px;height:6px;border-radius:99px}
  .ctr-pick{background:var(--obsidian);border:1px solid var(--graphite);border-radius:8px;padding:4px;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .ctr-pick-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--mist);user-select:none}
  .ctr-pick-row .ant-checkbox-wrapper{pointer-events:none}
  .ctr-pick-row:hover{background:rgba(255,255,255,.04)}
  .ctr-pick-row .dot{width:8px;height:8px;border-radius:99px;flex:none}
  .ctr-pick-row .n{margin-left:auto;color:var(--ash)}
  .ctr-pick-row .only{font-size:12px;color:var(--ash);visibility:hidden;padding:0 2px}
  .ctr-pick-row .only:hover{color:var(--paper)}
  .ctr-pick-row:hover .only{visibility:visible}
  .ctr-pick-sep{height:1px;background:var(--graphite);margin:4px 0}

  /* ---- env ---- */
  .env-val{display:inline-block;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .mx-val{display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .mx-odd{color:var(--amber)}

  /* ---- code views ---- */
  .code-box{background:var(--void);border:1px solid var(--graphite);border-radius:8px;max-height:calc(100vh - 470px);min-height:280px;overflow:auto}
  .code{padding:10px 0;color:var(--mist);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.75;letter-spacing:-.013em;width:max-content;min-width:100%}
  .ln{display:flex}
  .ln:hover .t{background:rgba(255,255,255,.02)}
  .ln .n{flex:0 0 52px;position:sticky;left:0;background:var(--void);padding-right:14px;text-align:right;color:var(--smoke);user-select:none}
  .ln .t{flex:1;min-width:0;padding-right:16px;white-space:pre}
  .ln.drift .t{background:rgba(217,164,65,.12)}
  .ln.drift .n{color:var(--amber)}
  .y-k{color:var(--paper)}
  .y-c{color:var(--ash)}

  .ant-table-wrapper .ant-table{background:transparent}
  .ant-table-tbody > tr > td{border-bottom:1px solid var(--graphite) !important}
  .svc-table .ant-table-tbody > tr{cursor:pointer}
  .svc-table .row-act{opacity:.35;transition:opacity .12s}
  .svc-table tr:hover .row-act, .svc-table tr:focus-within .row-act{opacity:1}
  .svc-table tr.flash > td{background:rgba(228,242,34,.06) !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--graphite);border-radius:99px;border:3px solid var(--void)}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-corner{background:transparent}
</style>
</head>

<script>

function StateDot({ state, size }) {
  const color = STATE_COLOR[state] || '#8a8f98';
  const s = size || 8;
  return html`<span title=${state} style=${{
    display: 'inline-block', width: s, height: s, borderRadius: 99, background: color,
    boxShadow: `0 0 0 3px ${color}22`, flex: '0 0 auto',

  const tones = {
    green: ['rgba(39,166,68,.13)', '#27a644'],
    coral: ['rgba(235,87,87,.12)', '#eb5757'],

    display: 'inline-block', padding: '0 6px', borderRadius: 4, fontSize: 12, lineHeight: '18px', whiteSpace: 'nowrap',

/* who breaks if `svc` goes away: direct dependents with their condition, then transitive ones via their parent */
function impactOf(svc, services) {
  const out = [];
  const seen = new Set([svc]);
  const walk = n => services.forEach(s => s.deps.forEach(d => {
    if (d.on === n && !seen.has(s.name)) {
      seen.add(s.name);
      out.push({ name: s.name, cond: d.cond, via: n === svc ? null : n });
      walk(s.name);
    }
  }));
  walk(svc);
  return out;
}

/* single-series sparkline: no legend (the column header names it), hover shows the sample under the pointer */
function Spark({ data, unit, w = 96, h = 22 }) {
  const [hi, setHi] = useState(null);
  const min = Math.min(...data), max = Math.max(...data), span = max - min || 1;
  const x = i => 2 + i * (w - 4) / (data.length - 1);
  const y = v => h - 3 - (v - min) / span * (h - 6);
  const d = data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const onMove = ev => {
    const r = ev.currentTarget.getBoundingClientRect();
    setHi(Math.max(0, Math.min(data.length - 1, Math.round((ev.clientX - r.left - 2) / (w - 4) * (data.length - 1)))));
  };
  const title = hi == null
    ? `${min}–${max} ${unit} over the last 30 min`
    : `${data[hi]} ${unit} · ${data.length - 1 - hi ? `${data.length - 1 - hi} min ago` : 'now'}`;
  return html`<${Tooltip} title=${title} mouseEnterDelay=${0}>
    <svg width=${w} height=${h} style=${{ display: 'block', cursor: 'crosshair' }} onMouseMove=${onMove} onMouseLeave=${() => setHi(null)}>
      <path d=${d} fill="none" stroke="#8a8f98" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      ${hi != null && html`<g>
        <line x1=${x(hi)} x2=${x(hi)} y1="0" y2=${h} stroke="#383b3f" strokeWidth="1" />
        <circle cx=${x(hi)} cy=${y(data[hi])} r="3" fill="#e5e5e6" stroke="#0f1011" strokeWidth="2" />

/* ---------- dependency graph ---------- */
function DependencyGraph({ states, services, onPick }) {
  const CTRS = useCtrs();
  const [hover, setHover] = useState(null);
  const W = 190, H = 48, GAP_X = 110, GAP_Y = 14, TOP = 26;

  const { nodes, edges, cols, width, height } = useMemo(() => {
    const depth = {};
    const d = name => {
      if (depth[name] != null) return depth[name];
      const s = services.find(x => x.name === name);
      return depth[name] = s.deps.length ? 1 + Math.max(...s.deps.map(x => d(x.on))) : 0;
    };
    services.forEach(s => d(s.name));
    const maxD = Math.max(...Object.values(depth));
    /* dependents on the left, dependencies on the right: arrows read "needs" */
    const cols = Array.from({ length: maxD + 1 }, (_, i) => services.filter(s => maxD - depth[s.name] === i));
    const rows = Math.max(...cols.map(c => c.length));
    const height = TOP + rows * (H + GAP_Y) - GAP_Y;
    const width = cols.length * W + (cols.length - 1) * GAP_X;
    const nodes = {};
    cols.forEach((col, ci) => {
      const off = (rows - col.length) * (H + GAP_Y) / 2;
      col.forEach((s, ri) => { nodes[s.name] = { ...s, x: ci * (W + GAP_X), y: TOP + off + ri * (H + GAP_Y) }; });
    });
    const edges = services.flatMap(s => s.deps.map(dep => ({ from: s.name, to: dep.on, cond: dep.cond })));
    return { nodes, edges, cols, width, height };
  }, [services]);

  /* hovering a node lights up everything it transitively needs and everything that needs it */
  const related = useMemo(() => {
    if (!hover) return null;
    const set = new Set([hover]);
    const walk = (n, dir) => edges.forEach(ed => {
      const [a, b] = dir === 'down' ? [ed.from, ed.to] : [ed.to, ed.from];
      if (a === n && !set.has(b)) { set.add(b); walk(b, dir); }
    });
    walk(hover, 'down'); walk(hover, 'up');
    return set;
  }, [hover, edges]);

  const startOrder = [...cols].reverse().map(c => c.map(s => s.name).join(', '));

  return html`
    <div>
      <div className="dag-wrap">
        <div className="dag" style=${{ width, height }}>
          ${cols.map((_, ci) => html`<span key=${ci} className="dag-col-h" style=${{ left: ci * (W + GAP_X) }}>
            Starts ${ci === cols.length - 1 ? 'first' : ci === 0 ? 'last' : `#${cols.length - ci}`}
          </span>`)}

              </marker>

            ${edges.map((ed, i) => {
              const a = nodes[ed.from], b = nodes[ed.to];
              const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2;

              return html`<g key=${i} opacity=${dim ? 0.25 : 1}>
                <path d=${`M${x1},${y1} C${x1 + 55},${y1} ${x2 - 55},${y2} ${x2},${y2}`}
                  fill="none" stroke=${on ? '#d0d6e0' : '#383b3f'} strokeWidth="1"
                  strokeDasharray=${ed.cond === 'started' ? '4 3' : undefined} markerEnd=${on ? 'url(#arr-on)' : 'url(#arr)'} />
                ${on && html`<text x=${(x1 + x2) / 2} y=${(y1 + y2) / 2 - 6} textAnchor="middle"
                  fill="#d0d6e0" fontSize="12" fontFamily="JetBrains Mono, monospace">${ed.cond}</text>`}
              </g>`;
            })}
          </svg>
          ${Object.values(nodes).map(n => {
            const kids = CTRS.filter(c => c.service === n.name);
            const up = kids.filter(c => states[c.key] === 'running').length;
            return html`<div key=${n.name}
              className=${'dag-node' + (related ? (related.has(n.name) ? ' on' : ' off') : '')}
              style=${{ left: n.x, top: n.y, width: W, height: H, borderLeft: `2px solid ${SVC_COLOR[n.name]}` }}
              onMouseEnter=${() => setHover(n.name)} onMouseLeave=${() => setHover(null)}
              onClick=${() => onPick(n.name)}>
              <span className="nm"><${StateDot} state=${svcState(n.name, states, CTRS)} size=${7} />${n.name}
                ${kids.length > 1 && html`<span className="mono dim">×${kids.length}</span>`}
                ${n.profile && html`<span className="mono dim">· ${n.profile}</span>`}</span>
              <span className="mono dim">${kids.length > 1 ? `${up}/${kids.length} running` : kids[0].name}</span>
            </div>`;
          })}
        </div>
      </div>
      <div className="toolbar" style=${{ marginTop: 12 }}>
        <span className="dim fs12">
          Arrows point to what a service needs · solid = waits for <${Mono}>healthy<//>, dashed = waits for <${Mono}>started<//> · hover a service to trace its chain and see conditions
        </span>
        <span className="spacer"></span>
        <span className="dim fs12">Start order: ${startOrder.map((s, i) => html`<span key=${i}>${i ? ' → ' : ''}<span className="mono" style=${{ color: '#d0d6e0' }}>${s}</span></span>`)}</span>
      </div>
    </div>`;
}

/* ---------- Info tab ---------- */
const INFO_SECTIONS = ['general', 'services', 'deps', 'ports', 'networks', 'volumes'];

function Stepper({ value, min, max, onChange }) {
  return html`<span className="stepper" onClick=${stop()}>
    <${Button} type="text" size="small" icon=${html`<${MinusOutlined} />`} disabled=${value <= min}
      aria-label="Scale down" onClick=${() => onChange(value - 1)} />
    <span className="mono">×${value}</span>
    <${Button} type="text" size="small" icon=${html`<${PlusOutlined} />`} disabled=${value >= max}
      aria-label="Scale up" onClick=${() => onChange(value + 1)} />
  </span>`;
}

function InfoTab({ states, onCopy, go, onLogs, flash, setFlash, services, profiles, toggleProfile, scale, removeOrphans, act }) {
  const CTRS = useCtrs();
  const { message } = AntApp.useApp();
  const { sec, button } = useSections(INFO_SECTIONS);

  const general = [
    { key: 'p', label: 'Project', children: html`<span className="row-flex"><${Pill} tone="teal">${PROJECT.name}<//>
      <span className="dim fs12">from <${Mono}>name:<//> in compose.yaml</span></span>` },
    { key: 'wd', label: 'Working directory', children: html`<span className="row-flex">
      <span className="copyable mono" onClick=${() => onCopy(PROJECT.workdir, 'Path')}>${PROJECT.workdir}<${CopyOutlined} /></span>
      <${Button} type="text" size="small" icon=${html`<${FolderOpenOutlined} />`}>Reveal<//></span>` },
    { key: 'f', label: 'Compose files', children: html`<span className="row-flex">
      ${PROJECT.files.map((f, i) => html`<span key=${f} className="row-flex">${i > 0 && html`<span className="dim">+</span>`}
        <a className="mono" style=${{ color: '#d0d6e0' }} onClick=${() => go.tab('config')}>${f}</a></span>`)}
      <span className="dim fs12">merged in this order</span></span>` },
    { key: 'env', label: 'Env file', children: html`<span className="row-flex"><${Mono}>${PROJECT.envFile}<//>
      <span className="dim fs12">3 variables used for interpolation</span></span>` },
    { key: 'pr', label: 'Profiles', children: html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      ${PROFILES.map(p => html`<span key=${p.name} className="row-flex">
        <${Switch} size="small" checked=${profiles.includes(p.name)} onChange=${() => toggleProfile(p.name)} />
        <${Mono}>${p.name}<//>
        <span className="dim fs12">${p.services.join(', ')} · ${p.desc}</span>
      </span>`)}
      <span className="dim fs12">Services without a profile always run. Switching one on runs <span className="mono">docker compose --profile NAME up -d</span>.</span>
    </div>` },
    { key: 'c', label: 'Created', children: html`<span><${Mono}>${PROJECT.created}<//> <span className="dim fs12">(first container)</span></span>` },
    { key: 'v', label: 'Compose', children: html`<span className="row-flex"><${Mono}>docker compose ${PROJECT.composeVersion}<//>
      <span className="dim fs12">config hash <span className="mono">${PROJECT.configHash}</span></span></span>` },
  ];

  const running = s => states[s.key] === 'running';
  const replicas = svc => CTRS.filter(c => c.service === svc).length;
  const svcCols = [
    { title: '', key: 'dot', width: 30, render: (_, c) => html`<${StateDot} state=${states[c.key]} />` },
    {
      title: 'Service', key: 'svc', width: 270, render: (_, c) => {
        const svc = services.find(s => s.name === c.service);
        const first = CTRS.find(x => x.service === c.service) === c;
        return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          <span className="row-flex" style=${{ gap: 6 }}>
            <span style=${{ width: 3, height: 12, borderRadius: 2, background: SVC_COLOR[c.service] }}></span>
            <span style=${{ color: c.orphan ? '#8a8f98' : '#fff' }}>${c.service}</span>
            ${c.replica && html`<span className="mono dim">#${c.replica}</span>`}
            ${svc && svc.scalable && first && html`<${Tooltip} title=${`Replicas · docker compose up -d --scale ${c.service}=N`}>
              <span><${Stepper} value=${replicas(c.service)} min=${1} max=${6} onChange=${n => scale(c.service, n)} /></span><//>`}
            ${svc && svc.profile && html`<${Pill} tone="neutral">profile: ${svc.profile}<//>`}
            ${c.fresh && html`<${Pill} tone="green">new<//>`}
            ${c.orphan && html`<${Tooltip} title="Not defined in any compose file anymore"><span><${Pill} tone="neutral">orphan<//></span><//>`}
            ${c.drift && html`<${Tooltip} title=${`${c.drift.key} changed in compose.yaml`}><span><${Pill} tone="amber">outdated<//></span><//>`}
          </span>
          <span className="mono dim">${c.name}</span>
        </div>`;
      },
    },
    { title: 'Image', dataIndex: 'image', render: (v, c) => {
      const img = IMAGES.find(i => i.service === c.service);
      return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}>
        <${Mono}>${v}<//>
        ${img && html`<span className="copyable mono dim" onClick=${ev => { ev.stopPropagation(); onCopy('sha256:' + img.id, 'Image ID'); }}>sha256:${img.id}<${CopyOutlined} /></span>`}
      </div>`;
    } },
    { title: 'Ports', key: 'ports', width: 150, render: (_, c) => c.ports.length
      ? html`<div style=${{ display: 'flex', flexDirection: 'column', whiteSpace: 'nowrap' }}>${c.ports.map(([h, p]) => html`<span key=${p} className="mono dim">${h ? `${h.replace('0.0.0.0', '')} → ${p}` : p}</span>`)}</div>`
      : html`<span className="dim">—</span>` },
    { title: 'Health', key: 'h', width: 90, render: (_, c) => !running(c)
      ? html`<span className="dim">—</span>`
      : c.health ? html`<${Pill} tone="green">${c.health}<//>` : html`<span className="dim fs12">no check</span>` },
    { title: 'CPU', key: 'cpu', width: 64, render: (_, c) => html`<span className="mono">${running(c) ? c.cpu.toFixed(1) + '%' : '—'}</span>` },
    { title: 'Memory · 30 min', key: 'mem', width: 196, render: (_, c) => {
      if (!running(c)) return html`<span className="dim">—</span>`;
      const t = TRENDS[c.key];
      const now = t ? t[t.length - 1] : c.mem;
      const rising = t && now - t[0] > 20;
      return html`<span className="row-flex" style=${{ gap: 10, flexWrap: 'nowrap' }} onClick=${stop()}>
        ${t ? html`<${Spark} data=${t} unit="MB" />` : html`<span className="dim fs12" style=${{ width: 96 }}>collecting…</span>`}
        <span className="mono" style=${{ minWidth: 52 }}>${now} MB</span>
        ${rising && html`<${Tooltip} title=${`Rising: +${now - t[0]} MB in 30 min`}><${RiseOutlined} style=${{ color: '#d9a441' }} /><//>`}
      </span>`;
    } },
    { title: 'Status', key: 'st', width: 150, render: (_, c) => html`<span className=${'fs12 ' + (states[c.key] === 'exited' ? '' : 'dim')}
      style=${states[c.key] === 'exited' ? { color: '#eb5757' } : null}>
      ${states[c.key] === 'running' ? `up ${c.uptime}` : states[c.key] === 'paused' ? 'paused' : c.down || 'exited'}
      ${c.restarts > 0 && html`<span className="dim"> · ${c.restarts}↻</span>`}</span>` },
    {
      title: '', key: 'act', width: 136, align: 'right',
      render: (_, c) => html`<span className="row-act row-flex" style=${{ gap: 0, flexWrap: 'nowrap' }} onClick=${stop()}>
        <${Tooltip} title=${running(c) ? 'Already running' : states[c.key] === 'paused' ? 'Unpause' : 'Start'}>
          <${Button} type="text" size="small" disabled=${running(c)} icon=${html`<${PlayCircleOutlined} />`}
            aria-label=${states[c.key] === 'paused' ? 'Unpause' : 'Start'} onClick=${() => act(c, 'start')} />
        <//>
        <${Tooltip} title=${states[c.key] === 'exited' ? 'Already stopped' : 'Stop'}>
          <${Button} type="text" size="small" disabled=${states[c.key] === 'exited'} icon=${html`<${PoweroffOutlined} />`}
            aria-label="Stop" onClick=${() => act(c, 'stop')} />
        <//>
        <${Dropdown} trigger=${['click']} placement="bottomRight" menu=${{ items: [
          { key: 'lg', icon: html`<${FileTextOutlined} />`, label: 'Logs', onClick: () => onLogs(c.key) },
          { key: 'fs', icon: html`<${FolderOutlined} />`, label: 'Files', onClick: () => go.container(c, 'Files') },
          { key: 'ex', icon: html`<${CodeOutlined} />`, label: running(c) ? 'Exec' : 'Exec (needs a running container)', disabled: !running(c),
            onClick: () => go.container(c, 'Exec') },
          { type: 'divider' },
          { key: 'rs', icon: html`<${ReloadOutlined} />`, label: 'Restart', disabled: !running(c), onClick: () => act(c, 'restart') },
          c.orphan
            ? { key: 'rm', icon: html`<${DeleteOutlined} />`, label: 'Remove orphan', danger: true, onClick: removeOrphans }
            : { key: 'rc', icon: html`<${SyncOutlined} />`, label: `Recreate ${c.service}`, onClick: () => message.success(`docker compose up -d --force-recreate ${c.service}`) },
          { key: 'op', icon: html`<${ExportOutlined} />`, label: 'Open container', onClick: () => go.container(c, 'Info') },
        ] }}>
          <${Button} type="text" size="small" icon=${html`<${MoreOutlined} />`} aria-label="More" />
        <//>
      </span>`,
    },
  ];

  const inactive = PROFILES.filter(p => !profiles.includes(p.name));
  const ports = CTRS.flatMap(c => c.ports.filter(p => p[0]).map(([h, p, url]) => ({ key: c.key + p, c, host: h, ctr: p, url })));

  const svcChips = list => html`<span className="row-flex" style=${{ gap: 6 }}>${list.map(s => html`<span key=${s} className="mono fs12"
    style=${{ color: SVC_COLOR[s], borderLeft: `2px solid ${SVC_COLOR[s]}`, paddingLeft: 6 }}>${s}</span>`)}</span>`;

  return html`
    <div style=${{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="toolbar">
        <span className="spacer"></span>
        ${button}
      </div>

      <${Section} id="general" title="General" ...${sec}>
        <${Descriptions} column=${1} size="small" bordered items=${general} />
      <//>

      <${Section} id="services" title="Services" ...${sec}
        extra=${html`<span className="dim fs12">${services.length} services · ${CTRS.length} containers · click a row to open it</span>`}>
        <${Table} className="svc-table" size="small" pagination=${false} dataSource=${CTRS} columns=${svcCols}
          rowClassName=${c => (flash === c.service ? 'flash' : '')}
          onRow=${c => ({ onClick: () => go.container(c, 'Info') })} />
        ${inactive.length > 0 && html`<div className="inactive">
          <div className="dim fs12" style=${{ marginBottom: 4 }}>Defined but not running — profile off</div>
          ${inactive.flatMap(p => p.services.map(s => html`<div key=${s} className="inactive-row">
            <span style=${{ width: 3, height: 12, borderRadius: 2, background: SVC_COLOR[s] }}></span>
            <span className="muted">${s}</span>
            <${Pill} tone="neutral">profile: ${p.name}<//>
            <span className="dim fs12">${p.desc}</span>
            <span style=${{ flex: 1 }}></span>
            <${Button} size="small" icon=${html`<${PlayCircleOutlined} />`} onClick=${() => toggleProfile(p.name)}>Enable ${p.name}<//>
          </div>`))}
        </div>`}
      <//>

      <${Section} id="deps" title="Dependencies" ...${sec}>
        <${DependencyGraph} states=${states} services=${services} onPick=${s => { setFlash(s); setTimeout(() => setFlash(null), 1200); }} />
      <//>

      <${Section} id="ports" title="Published ports" ...${sec}
        extra=${html`<span className="dim fs12">${ports.length} on the host</span>`}>
        <${Table} size="small" pagination=${false} dataSource=${ports} columns=${[
          { title: 'Service', key: 's', width: 160, render: (_, r) => svcChips([r.c.service]) },
          { title: 'Host', dataIndex: 'host', width: 170, render: v => html`<${Mono}>${v}<//>` },
          { title: '', key: 'arrow', width: 30, render: () => html`<span className="dim">→</span>` },
          { title: 'Container', dataIndex: 'ctr', render: v => html`<${Mono}>${v}<//>` },
          { title: '', key: 'open', align: 'right', render: (_, r) => html`<span className="row-flex">
            <${Tooltip} title="Copy host address"><${Button} type="text" size="small" icon=${html`<${CopyOutlined} />`}
              onClick=${() => onCopy(r.host.replace('0.0.0.0', 'localhost'), 'Address')} /><//>
            ${r.url && html`<${Button} type="text" size="small" icon=${html`<${ExportOutlined} />`}>Open<//>`}
          </span>` },
        ]} />
      <//>

      <${Section} id="networks" title="Networks" ...${sec}>
        <${Table} size="small" pagination=${false} dataSource=${NETWORKS} columns=${[
          { title: 'Network', dataIndex: 'name', render: (v, r) => html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            <span className="row-flex" style=${{ gap: 6 }}><span style=${{ color: '#fff' }}>${v}</span>
              ${r.scope === 'external' && html`<${Pill} tone="lav">external<//>`}</span>
            <span className="mono dim">${r.driver} · ${r.subnet}</span></div>` },
          { title: 'Attached', dataIndex: 'services', render: v => svcChips(v) },
        ]} />
      <//>
      <${Section} id="volumes" title="Volumes & mounts" ...${sec}>
        <${Table} size="small" pagination=${false} dataSource=${VOLUMES} columns=${[
          { title: 'Source', dataIndex: 'name', render: (v, r) => html`<div style=${{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            <span className="row-flex" style=${{ gap: 6 }}><${Pill} tone=${r.type === 'bind' ? 'lav' : 'teal'}>${r.type}<//><${Mono}>${v}<//>
              ${r.ro && html`<${Pill} tone="neutral">ro<//>`}</span>
            <span className="mono dim">${r.target}</span></div>` },
          { title: 'Used by', dataIndex: 'services', render: v => svcChips(v) },
          { title: 'Size', dataIndex: 'size', width: 70, align: 'right', render: v => html`<span className="mono dim">${v}</span>` },
        ]} />
      <//>
    </div>`;
}

/* ---------- Environment tab ---------- */
const srcTone = v => (v === 'compose' ? 'teal' : v === 'runtime' ? 'lav' : 'neutral');
const toDotenv = rows => rows.map(r => `${r.k}=${/[\s"']/.test(r.v) ? JSON.stringify(r.v) : r.v}`).join('\n');

function EnvTab({ states, onCopy, go }) {
  const CTRS = useCtrs();
  const [q, setQ] = useState('');
  const [src, setSrc] = useState('all');
  const [mode, setMode] = useState('list');
  const [reveal, setReveal] = useState(false);
  const [onlyDiff, setOnlyDiff] = useState(true);
  const { sec, button } = useSections(CTRS.map(c => c.key));

  const match = r => (src === 'all' || r.src === src) &&
    (!q || r.k.toLowerCase().includes(q.toLowerCase()) || r.v.toLowerCase().includes(q.toLowerCase()));
  const shown = r => (r.secret && !reveal ? MASK : r.v);
  const total = CTRS.reduce((n, c) => n + envOf(c).length, 0);

  const cols = [
    { title: 'Variable', dataIndex: 'k', width: 240, render: v => html`<span className="mono" style=${{ color: '#fff' }}>${v}</span>` },
    { title: 'Value', dataIndex: 'v', render: (v, r) => html`<span className=${'mono env-val' + (r.secret && !reveal ? ' dim' : '')} title=${r.secret && !reveal ? '' : v}>${shown(r)}</span>` },
    { title: 'Source', dataIndex: 'src', width: 100, render: v => html`<${Pill} tone=${srcTone(v)}>${v}<//>` },
    { title: '', key: 'a', width: 46, align: 'right', render: (_, r) => html`<${Tooltip} title="Copy KEY=value">
      <${Button} type="text" size="small" icon=${html`<${CopyOutlined} />`} onClick=${() => onCopy(`${r.k}=${r.v}`, r.k)} /><//>` },
  ];

  /* matrix: one row per variable, one column per container */
  const matrix = useMemo(() => {
    const keys = [...new Set(CTRS.flatMap(envOf).filter(match).map(r => r.k))];
    return keys.map(k => {
      const cells = Object.fromEntries(CTRS.map(c => [c.key, envOf(c).find(r => r.k === k)]));
      const vals = Object.values(cells).filter(Boolean).map(r => r.v);
      const freq = vals.reduce((a, v) => ({ ...a, [v]: (a[v] || 0) + 1 }), {});
      const mode = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
      return { key: k, k, cells, present: vals.length, differs: Object.keys(freq).length > 1, mode };
    }).filter(r => r.present > 1 && (!onlyDiff || r.differs) && r.k !== 'HOSTNAME');
  }, [q, src, onlyDiff, CTRS]);

  const mxCols = [
    { title: 'Variable', dataIndex: 'k', width: 190, fixed: 'left', render: (v, r) => html`<span className="row-flex" style=${{ gap: 6 }}>
      <span className="mono" style=${{ color: '#fff' }}>${v}</span>${r.differs && html`<${Pill} tone="amber">differs<//>`}</span>` },
    ...CTRS.map(c => ({
      title: html`<span className="row-flex" style=${{ gap: 6 }}><span style=${{ width: 3, height: 10, borderRadius: 2, background: SVC_COLOR[c.service] }}></span>${c.label}</span>`,
      key: c.key, width: 190,
      render: (_, r) => {
        const cell = r.cells[c.key];
        if (!cell) return html`<span className="dim">—</span>`;
        return html`<span className=${'mono mx-val' + (r.differs && cell.v !== r.mode ? ' mx-odd' : '') + (cell.secret && !reveal ? ' dim' : '')}
          title=${cell.secret && !reveal ? '' : cell.v}>${shown(cell)}</span>`;
      },
    })),
  ];

  const visible = CTRS.map(c => ({ c, rows: envOf(c).filter(match) })).filter(x => !q || x.rows.length);
  const hiddenCount = CTRS.length - visible.length;

  return html`
    <div style=${{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="toolbar">
        <${Input} placeholder="Filter across all containers" allowClear value=${q} onChange=${ev => setQ(ev.target.value)}
          prefix=${html`<${SearchOutlined} style=${{ color: '#62666d' }} />`} style=${{ width: 260 }} />
        <${Segmented} value=${src} onChange=${setSrc} options=${[
          { label: 'All', value: 'all' }, { label: 'Compose', value: 'compose' },
          { label: 'Image', value: 'image' }, { label: 'Runtime', value: 'runtime' },
        ]} />
        <${Segmented} value=${mode} onChange=${setMode} options=${[
          { label: 'By container', value: 'list' }, { label: 'Compare', value: 'matrix' },
        ]} />
        <span className="spacer"></span>
        <${Button} icon=${html`<${reveal ? EyeInvisibleOutlined : EyeOutlined} />`} onClick=${() => setReveal(r => !r)}>
          ${reveal ? 'Hide secrets' : 'Reveal secrets'}
        <//>
        ${mode === 'list' && button}
      </div>

      ${mode === 'list'
        ? html`${visible.map(({ c, rows }) => html`<${Section} key=${c.key} id=${c.key} ...${sec}
            title=${html`<span className="row-flex" style=${{ gap: 8 }}>
              <span style=${{ width: 3, height: 12, borderRadius: 2, background: SVC_COLOR[c.service] }}></span>${c.label}</span>`}
            extra=${html`<span className="row-flex" style=${{ flex: 1 }}>
              <${StateDot} state=${states[c.key]} size=${6} />
              <span className="mono dim">${c.name}</span>
              <span className="dim fs12">· ${rows.length}${rows.length !== envOf(c).length ? ` of ${envOf(c).length}` : ''} vars</span>
              ${c.replica && html`<span className="dim fs12">· replica of ${c.service}, differs only in HOSTNAME</span>`}
              <span style=${{ flex: 1 }}></span>
              <${Tooltip} title="Copy these rows as .env">
                <${Button} size="small" type="text" icon=${html`<${CopyOutlined} />`} onClick=${stop(() => onCopy(toDotenv(rows), `${c.label} env`))}>.env<//>
              <//>
              <${Button} size="small" type="text" icon=${html`<${ExportOutlined} />`} onClick=${stop(() => go.container(c, 'Environment'))}>Open<//>
            </span>`}>
            <${Table} size="small" columns=${cols} dataSource=${rows.map((r, i) => ({ ...r, key: i }))} pagination=${false}
              locale=${{ emptyText: html`<${Empty} description="No matching variables" />` }} />
          <//>`)}
          ${hiddenCount > 0 && html`<div className="dim fs12">${hiddenCount} container${hiddenCount > 1 ? 's' : ''} hidden — no matching variables.</div>`}`
        : html`<div className="card">
            <div className="toolbar" style=${{ marginBottom: 12 }}>
              <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                <${Switch} size="small" checked=${onlyDiff} onChange=${setOnlyDiff} />
                <span className="dim fs12">Only variables that differ</span>
              </span>
              <span className="spacer"></span>
              <span className="dim fs12">
                Variables set in 2+ containers · <span style=${{ color: '#d9a441' }}>amber</span> = differs from the most common value · HOSTNAME skipped
              </span>
            </div>
            <${Table} size="small" pagination=${false} columns=${mxCols} dataSource=${matrix} scroll=${{ x: 'max-content' }}
              locale=${{ emptyText: html`<${Empty} description=${onlyDiff ? 'No differences — shared variables agree everywhere' : 'No shared variables'} />` }} />
          </div>`}

      <div className="dim fs12">Values are read-only — change them in compose.yaml and recreate the service. ${total} variables across ${CTRS.length} containers.</div>
    </div>`;
}

/* ---------- Logs tab ---------- */
const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const RANK = { debug: 0, info: 1, warn: 2, error: 3 };

function LogsTab({ solo, states }) {
  const CTRS = useCtrs();
  const keys = CTRS.map(c => c.key);
  const [q, setQ] = useState('');
  const [level, setLevel] = useState('all');
  const [hidden, setHidden] = useState(solo ? keys.filter(k => k !== solo) : []);
  const [events, setEvents] = useState(true);
  const [view, setView] = useState('merged');
  const [follow, setFollow] = useState(!solo);
  const [timestamps, setTimestamps] = useState(true);
  const [wrap, setWrap] = useState(true);
  const [tail, setTail] = useState('500');
  const [anchor, setAnchor] = useState(null);
  const [cleared, setCleared] = useState(0);
  /* side-by-side columns start from the toolbar settings and keep their own changes */
  const [colOpts, setColOpts] = useState({});
  const boxRef = useRef(null);
  const optsOf = k => ({ timestamps, wrap, follow, ...colOpts[k] });
  const flipCol = (k, name) => setColOpts(o => ({ ...o, [k]: { ...o[k], [name]: !optsOf(k)[name] } }));
  /* toolbar toggles read "on" only when every visible column is on, and flipping one resets every column */
  const allOn = name => (view === 'merged' ? optsOf(null)[name] : shownKeys.length > 0 && shownKeys.every(k => optsOf(k)[name]));
  const setAll = (name, set) => {
    set(!allOn(name));
    setColOpts(o => Object.fromEntries(Object.entries(o).map(([k, { [name]: _, ...rest }]) => [k, rest])));
  };

  const shownKeys = keys.filter(k => !hidden.includes(k));
  const rows = useMemo(() => LOGS.slice(cleared).filter(([, k, lv, msg]) =>
    shownKeys.includes(k) &&
    (lv === 'event' ? events : (level === 'all' || RANK[lv] >= RANK[level])) &&
    (!q || msg.toLowerCase().includes(q.toLowerCase()))
  ), [q, level, hidden, events, cleared, CTRS]);

  /* follow sticks to the bottom; an anchor instead scrolls every pane to the highlighted moment */
  useEffect(() => {
    const panes = boxRef.current ? [...boxRef.current.querySelectorAll('[data-pane]')] : [];
    panes.forEach(pane => {
      const hit = anchor && pane.querySelector('.lg-anchor, .lg-near');
      if (hit) pane.scrollTop = hit.offsetTop - pane.clientHeight / 2;
      else if (pane.dataset.follow) pane.scrollTop = pane.scrollHeight;
    });
  }, [rows, follow, colOpts, anchor, view]);

  const count = k => LOGS.filter(l => l[1] === k).length;
  const errCount = LOGS.filter(l => l[2] === 'error' && shownKeys.includes(l[1])).length;
  const warnCount = LOGS.filter(l => l[2] === 'warn' && shownKeys.includes(l[1])).length;

  const toggle = k => setHidden(h => h.includes(k) ? h.filter(x => x !== k) : [...h, k]);
  const soloOn = k => setHidden(h => (h.length === keys.length - 1 && !h.includes(k)) ? [] : keys.filter(x => x !== k));

  const near = ts => anchor && Math.abs(dayjs(ts).valueOf() - dayjs(anchor).valueOf()) <= 2000;

  const renderMsg = msg => {
    if (!q) return msg;
    const i = msg.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return msg;
    return html`${msg.slice(0, i)}<span className="hl">${msg.slice(i, i + q.length)}</span>${msg.slice(i + q.length)}`;
  };

  const line = ([ts, k, lv, msg], i, withTag, { timestamps, wrap }) => {
    const c = CTRS.find(x => x.key === k);
    const cls = 'lg-row lg-' + lv + (anchor === ts ? ' lg-anchor' : near(ts) ? ' lg-near' : '');
    return html`<div key=${i} className=${cls} style=${{ whiteSpace: wrap ? 'pre-wrap' : 'pre' }}>
      ${timestamps && html`<span className="lg-ts" title="Highlight everything within ±2s across containers"
        onClick=${() => setAnchor(a => (a === ts ? null : ts))}>${dayjs(ts).format('HH:mm:ss.SSS')}</span>`}
      ${withTag && html`<span className="lg-tag" style=${{ color: SVC_COLOR[c.service], borderColor: SVC_COLOR[c.service] }}
        title=${`${c.name} — click to show only this`} onClick=${() => soloOn(k)}>${c.label}</span>`}
      <span className="lg-lvl">${lv === 'event' ? '●' : lv.toUpperCase()}</span>
      <span className="msg">${renderMsg(msg)}</span>
    </div>`;
  };

  const empty = html`<span className="dim" style=${{ padding: '0 12px' }}>No log lines match the current filter.</span>`;

  return html`
    <div className="card">
      <div className="toolbar" style=${{ marginBottom: 10 }}>
        <${Input} placeholder="Search all containers" allowClear value=${q} onChange=${ev => setQ(ev.target.value)}
          prefix=${html`<${SearchOutlined} style=${{ color: '#62666d' }} />`} style=${{ width: 220 }} />
        <${Segmented} value=${level} onChange=${setLevel} options=${[
          { label: 'All', value: 'all' }, { label: 'Info', value: 'info' },
          { label: `Warn ${warnCount}`, value: 'warn' }, { label: `Error ${errCount}`, value: 'error' },
        ]} />
        <${Select} value=${tail} onChange=${setTail} style=${{ width: 150 }} options=${[
          { value: '100', label: 'Last 100 / ctr' }, { value: '500', label: 'Last 500 / ctr' },
          { value: 'since', label: 'Since last up' }, { value: 'all', label: 'All lines' },
        ]} />
        <span className="spacer"></span>
        <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <${Switch} size="small" checked=${allOn('timestamps')} onChange=${() => setAll('timestamps', setTimestamps)} />
          <span className="dim fs12">Timestamps${view === 'split' ? ' (all)' : ''}</span>
        </span>
        ${view === 'merged' && html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <${Switch} size="small" checked=${wrap} onChange=${setWrap} /><span className="dim fs12">Wrap</span>
        </span>`}
        <${Button} icon=${html`<${VerticalAlignBottomOutlined} />`} type=${allOn('follow') ? 'primary' : 'default'}
          onClick=${() => setAll('follow', setFollow)}>${view === 'split' ? 'Follow all' : 'Follow'}<//>
        <${Tooltip} title=${view === 'split' ? 'Clear all columns' : 'Clear'}><${Button} icon=${html`<${ClearOutlined} />`} aria-label="Clear" onClick=${() => setCleared(LOGS.length)} /><//>
        <${Tooltip} title=${view === 'split' ? `Download all ${shownKeys.length} columns (.zip)` : 'Download'}><${Button} icon=${html`<${DownloadOutlined} />`} aria-label="Download" /><//>
      </div>

      <div className="toolbar" style=${{ marginBottom: 12, gap: 6 }}>
        <${Dropdown} trigger=${['click']} placement="bottomLeft" popupRender=${() => html`<div className="ctr-pick">
          <div className="ctr-pick-row" role="checkbox" aria-checked=${hidden.length === 0} onClick=${() => setHidden(hidden.length === 0 ? keys : [])}>
            <${Checkbox} tabIndex=${-1} checked=${hidden.length === 0} indeterminate=${hidden.length > 0 && shownKeys.length > 0} />
            <span>All containers</span>
            <span className="n mono fs12">${shownKeys.length} / ${keys.length}</span>
          </div>
          <div className="ctr-pick-sep"></div>
          ${CTRS.map(c => html`<div key=${c.key} className="ctr-pick-row" title=${c.name} role="checkbox"
            aria-checked=${!hidden.includes(c.key)} onClick=${() => toggle(c.key)}>
            <${Checkbox} tabIndex=${-1} checked=${!hidden.includes(c.key)} />
            <span className="dot" style=${{ background: SVC_COLOR[c.service] }}></span>
            <span>${c.label}</span>
            ${states[c.key] !== 'running' && html`<span className="mono fs12" style=${{ color: STATE_COLOR[states[c.key]] }}>${states[c.key]}</span>`}
            <span className="n mono fs12">${count(c.key)}</span>
            <a className="only" onClick=${ev => { ev.stopPropagation(); setHidden(keys.filter(x => x !== c.key)); }}>only</a>
          </div>`)}
        </div>`}>
          <span className="chip" role="button" tabIndex=${0}>
            <span className="dots">${CTRS.filter(c => !hidden.includes(c.key)).map(c =>
              html`<i key=${c.key} style=${{ background: SVC_COLOR[c.service] }}></i>`)}</span>
            Containers
            <span className="n mono">${shownKeys.length === keys.length ? 'all' : `${shownKeys.length} / ${keys.length}`}</span>
            <${DownOutlined} style=${{ fontSize: 10, color: '#62666d' }} />
          </span>
        <//>
        <span className=${'chip' + (events ? '' : ' off')} onClick=${() => setEvents(v => !v)} role="checkbox" aria-checked=${events} tabIndex=${0}>
          <${ApartmentOutlined} style=${{ color: events ? '#8a8f98' : '#62666d' }} /> Lifecycle events
        </span>
        ${hidden.length > 0 && html`<${Button} type="text" size="small" onClick=${() => setHidden([])}>Show all<//>`}
        <span className="spacer"></span>
        <${Segmented} value=${view} onChange=${setView} options=${[
          { label: html`<span><${UnorderedListOutlined} /> Merged</span>`, value: 'merged' },
          { label: html`<span><${ColumnWidthOutlined} /> Side by side</span>`, value: 'split' },
        ]} />
      </div>

      <div ref=${boxRef}>
        ${view === 'merged'
          ? html`<pre className="logs" data-pane="1" data-follow=${follow ? '1' : undefined}>${rows.length ? rows.map((r, i) => line(r, i, true, { timestamps, wrap })) : empty}</pre>`
          : shownKeys.length === 0
            ? html`<pre className="logs">${empty}</pre>`
            : html`<div className="lg-split">
                ${shownKeys.map(k => {
                  const c = CTRS.find(x => x.key === k);
                  const mine = rows.filter(r => r[1] === k);
                  const o = optsOf(k);
                  const opt = (name, title, icon) => html`<${Tooltip} title=${`${title}: ${o[name] ? 'on' : 'off'}`}>
                    <${Button} type="text" size="small" className=${o[name] ? 'on' : ''} icon=${icon}
                      aria-label=${title} aria-pressed=${o[name]} onClick=${() => flipCol(k, name)} />
                  <//>`;
                  return html`<div key=${k} className="lg-col">
                    <div className="lg-col-h" style=${{ borderTop: `2px solid ${SVC_COLOR[c.service]}` }}>
                      <${StateDot} state=${states[k]} size=${6} />
                      <span style=${{ color: '#fff' }}>${c.label}</span>
                      <span className="mono dim nm">${c.name}</span>
                      <span style=${{ flex: 1 }}></span>
                      <span className="mono dim">${mine.length}</span>
                      <span className="opts">
                        ${opt('timestamps', 'Timestamps', html`<${ClockCircleOutlined} />`)}
                        ${opt('wrap', 'Wrap', html`<${EnterOutlined} />`)}
                        ${opt('follow', 'Follow', html`<${VerticalAlignBottomOutlined} />`)}
                        <${Tooltip} title=${`Download ${c.name} logs`}>
                          <${Button} type="text" size="small" icon=${html`<${DownloadOutlined} />`} aria-label="Download" />
                        <//>
                      </span>
                    </div>
                    <pre className="logs" data-pane="1" data-follow=${o.follow ? '1' : undefined}>${mine.length ? mine.map((r, i) => line(r, i, false, o)) : html`<span className="dim" style=${{ padding: '0 12px' }}>No matching lines.</span>`}</pre>
                  </div>`;
                })}
              </div>`}
      </div>

      <div className="toolbar" style=${{ marginTop: 10 }}>
        <span className="dim fs12">
          ${rows.length} lines from ${shownKeys.length} of ${CTRS.length} containers
          ${(view === 'merged' ? timestamps : shownKeys.some(k => optsOf(k).timestamps)) && ` · times in ${LOCAL_TZ} (UTC${dayjs().format('Z')})`}
        </span>
        <span className="spacer"></span>
        ${anchor
          ? html`<span className="fs12" style=${{ color: '#02b8cc' }}>Highlighting ±2s around ${dayjs(anchor).format('HH:mm:ss.SSS')}${view === 'split' ? ' · every column scrolled to it' : ''}
              <a style=${{ marginLeft: 8, color: '#d0d6e0' }} onClick=${() => setAnchor(null)}>clear</a></span>`
          : html`<span className="dim fs12">Tip: click a timestamp to line up what every container did at that moment.</span>`}
      </div>
    </div>`;
}

/* ---------- Config tab ---------- */
function YamlView({ text, driftLine }) {
  const lines = text.split('\n');
  return html`<div className="code-box"><div className="code">
    ${lines.map((ln, i) => {
      const cm = /^(\s*)(#.*)$/.exec(ln);
      const kv = /^(\s*-?\s*)([\w.-]+)(:)(.*)$/.exec(ln);
      const drift = i + 1 === driftLine;
      const body = cm ? html`${cm[1]}<span className="y-c">${cm[2]}</span>`
        : kv ? html`${kv[1]}<span className="y-k">${kv[2]}</span><span className="y-c">${kv[3]}</span>${kv[4]}`
        : (ln || ' ');
      return html`<div key=${i} className=${'ln' + (drift ? ' drift' : '')}>
        <span className="n">${drift ? '≠ ' : ''}${i + 1}</span>
        <span className="t">${body}${drift && html`<span className="y-c">   # running container: info</span>`}</span>
      </div>`;
    })}
  </div></div>`;
}

/* ---------- detail page ---------- */
function GroupDetail() {
  const { modal, message } = AntApp.useApp();
  const [tab, setTab] = useState('info');
  const [ctrs, setCtrs] = useState(BASE_CTRS);
  const [states, setStates] = useState(Object.fromEntries(BASE_CTRS.map(c => [c.key, c.state])));
  const [profiles, setProfiles] = useState([]);
  const [logSolo, setLogSolo] = useState(null);
  const [flash, setFlash] = useState(null);

  const services = useMemo(() => SERVICES.filter(s => !s.profile || profiles.includes(s.profile)), [profiles]);

  const onCopy = (text, what) => {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    message.success(`${what} copied`);
  };

  /* in the real app these route to the container detail page with the given tab selected */
  const go = {
    tab: setTab,
    container: (c, t) => message.info(html`<span>Opens <span className="mono">${c.name}</span> › ${t}</span>`),
  };
  const onLogs = key => { setLogSolo(key); setTab('logs'); };

  const apply = (keys, verb) => setStates(s => ({ ...s, ...Object.fromEntries(keys.map(k => [k, verb === 'stop' ? 'exited' : 'running'])) }));

  /* start is always safe; stop/restart first checks who depends on the service and offers to include them */
  const act = (c, verb) => {
    const Verb = verb[0].toUpperCase() + verb.slice(1);
    if (verb === 'start') {
      apply([c.key], verb);
      message.success(`${c.name} ${states[c.key] === 'paused' ? 'unpaused' : 'started'}`);
      return;
    }
    const siblingsUp = ctrs.some(x => x.service === c.service && x.key !== c.key && states[x.key] === 'running');
    const hit = siblingsUp ? [] : impactOf(c.service, services)
      .filter(d => ctrs.some(x => x.service === d.name && states[x.key] !== 'exited'));
    if (!hit.length) {
      apply([c.key], verb);
      message[verb === 'stop' ? 'warning' : 'success'](`${c.name} ${verb === 'stop' ? 'stopped' : 'restarted'}`);
      return;
    }
    const dependents = ctrs.filter(x => hit.some(h => h.name === x.service));
    const m = modal.confirm({
      title: `${Verb} ${c.service}?`, centered: true, width: 520,
      icon: html`<${WarningOutlined} style=${{ color: '#d9a441' }} />`,
      content: html`<div>
        <div style=${{ marginBottom: 10 }}>${hit.length} service${hit.length > 1 ? 's' : ''} depend on <${Mono}>${c.service}<//>:</div>
        <div className="impact">
          ${hit.map(h => html`<div key=${h.name} className="impact-row" style=${{ paddingLeft: h.via ? 22 : 8 }}>
            <span style=${{ width: 3, height: 12, borderRadius: 2, background: SVC_COLOR[h.name] }}></span>
            <${Mono}>${h.name}<//>
            <span className="dim fs12">${h.via ? `via ${h.via}` : `waits for ${c.service} ${h.cond}`}</span>
          </div>`)}
        </div>
        <div className="dim fs12" style=${{ marginTop: 10 }}>
          ${verb === 'stop'
            ? `They keep running but lose ${c.service}; requests that need it fail until it's back.`
            : `Expect a short outage while ${c.service} restarts. Dependents are not restarted unless you include them.`}
        </div>
      </div>`,
      okText: `${Verb} ${c.service} only`, okType: verb === 'stop' ? 'danger' : 'default',
      onOk: () => { apply([c.key], verb); message.warning(`docker compose ${verb} ${c.service}`); },
      footer: (_, { OkBtn, CancelBtn }) => html`<${React.Fragment}>
        <${CancelBtn} />
        <${OkBtn} />
        <${Button} type="primary" danger=${verb === 'stop'} onClick=${() => {
          apply([c.key, ...dependents.map(d => d.key)], verb);
          message.warning(`docker compose ${verb} ${[c.service, ...hit.map(h => h.name)].join(' ')}`);
          m.destroy();
        }}>${Verb} all ${hit.length + 1}<//>
      <//>`,
    });
  };

  const scale = (svc, n) => {
    const cur = ctrs.filter(c => c.service === svc);
    if (n > cur.length) {
      const top = Math.max(...cur.map(c => c.replica));
      const add = Array.from({ length: n - cur.length }, (_, i) => workerReplica(top + 1 + i));
      setCtrs(cs => {
        const at = cs.map(c => c.service).lastIndexOf(svc);
        return [...cs.slice(0, at + 1), ...add, ...cs.slice(at + 1)];
      });
      apply(add.map(a => a.key), 'start');
    } else {
      const drop = [...cur].sort((a, b) => b.replica - a.replica).slice(0, cur.length - n).map(c => c.key);
      setCtrs(cs => cs.filter(c => !drop.includes(c.key)));
    }
    message.success(`docker compose up -d --scale ${svc}=${n} --no-recreate`);
  };

  const toggleProfile = name => {
    const p = PROFILES.find(x => x.name === name);
    if (profiles.includes(name)) {
      setProfiles(ps => ps.filter(x => x !== name));
      setCtrs(cs => cs.filter(c => !p.services.includes(c.service)));
      message.info(`docker compose --profile ${name} rm -sf ${p.services.join(' ')}`);
    } else {
      const add = p.services.map(s => PROFILE_CTRS[s]);
      setProfiles(ps => [...ps, name]);
      setCtrs(cs => {
        const at = cs.findIndex(c => c.orphan);
        return at < 0 ? [...cs, ...add] : [...cs.slice(0, at), ...add, ...cs.slice(at)];
      });
      apply(add.map(a => a.key), 'start');
      message.success(`docker compose --profile ${name} up -d`);
    }
  };

  const removeOrphans = () => {
    const orphans = ctrs.filter(c => c.orphan);
    modal.confirm({
      title: 'Remove orphan containers?', centered: true, okText: 'Remove', okType: 'danger',
      content: html`<span>${orphans.map(o => html`<${Mono} key=${o.key}>${o.name}<//>`)} will be stopped and removed. Its image and volumes are kept.</span>`,
      onOk: () => { setCtrs(cs => cs.filter(c => !c.orphan)); message.success('docker compose up -d --remove-orphans'); },
    });
  };

  const list = ctrs.map(c => states[c.key]);
  const up = list.filter(s => s === 'running').length;
  const allUp = up === list.length;
  const anyActive = list.some(s => s !== 'exited');
  const setAll = s => setStates(st => ({ ...st, ...Object.fromEntries(ctrs.map(c => [c.key, s])) }));

  const run = ctrs.filter(c => states[c.key] === 'running');
  const cpu = run.reduce((a, c) => a + c.cpu, 0);
  const mem = run.reduce((a, c) => a + c.mem, 0);
  const top = run.reduce((a, c) => (!a || c.mem > a.mem ? c : a), null);
  const rx = run.reduce((a, c) => a + c.net[0], 0);
  const tx = run.reduce((a, c) => a + c.net[1], 0);
  const restarts = ctrs.reduce((a, c) => a + c.restarts, 0);

  const tip = (label, title) => html`<${Tooltip} title=${title} placement="left" mouseEnterDelay=${0.3} align=${{ offset: [-40, 0] }}>
    <span style=${{ display: 'block' }}>${label}</span>
  <//>`;

  const down = volumes => modal.confirm({
    title: volumes ? 'Down and delete volumes?' : 'Take the project down?', centered: true,
    okText: volumes ? 'Delete everything' : 'Down', okType: 'danger',
    content: html`<span>All <${Mono}>${ctrs.length}<//> containers and the <${Mono}>shop_default<//> network will be removed.
      ${volumes ? html` Volumes <${Mono}>shop_pgdata<//>, <${Mono}>shop_redis-data<//> and <${Mono}>shop_gateway-conf<//> (1.4 GB) are deleted permanently.` : ' Named volumes are kept.'}</span>`,
  });

  const moreItems = [
    { key: 'pull', icon: html`<${CloudDownloadOutlined} />`, label: tip('Pull images', 'docker compose pull — fetches newer images. Running containers keep the old one until recreated.') },
    { key: 'build', icon: html`<${BuildOutlined} />`, label: tip('Build', 'docker compose build — rebuilds services that have a build: section (api).') },
    { key: 'recreate', icon: html`<${SyncOutlined} />`, label: tip('Recreate outdated', 'docker compose up -d — recreates only services whose config or image changed (api).') },
    { key: 'force', icon: html`<${SyncOutlined} />`, label: tip('Force recreate all', 'docker compose up -d --force-recreate — every container is replaced, even unchanged ones.') },
    { type: 'divider' },
    { key: 'cpn', icon: html`<${CopyOutlined} />`, label: 'Copy project name', onClick: () => onCopy(PROJECT.name, 'Project name') },
    { key: 'cfg', icon: html`<${FileTextOutlined} />`, label: tip('Copy resolved config', 'docker compose config — all files merged and variables interpolated. Secrets are not masked.'), onClick: () => onCopy(COMPOSE_YAML, 'Resolved config') },
    { key: 'dir', icon: html`<${FolderOpenOutlined} />`, label: 'Reveal project folder' },
    { type: 'divider' },
    { key: 'orph', icon: html`<${DisconnectOutlined} />`, disabled: !ctrs.some(c => c.orphan), label: tip('Remove orphans', 'Removes containers labelled with this project whose service is no longer in the compose files.'), onClick: removeOrphans },
    { key: 'down', icon: html`<${DeleteOutlined} />`, danger: true, label: tip('Down', 'Removes containers and project networks. Named volumes are kept.'), onClick: () => down(false) },
    { key: 'downv', icon: html`<${DeleteOutlined} />`, danger: true, label: tip('Down + delete volumes', 'Also deletes named volumes. Database data is lost.'), onClick: () => down(true) },
  ];

  const tabs = [
    { key: 'info', label: html`<span><${InfoCircleOutlined} /> Info</span>` },
    { key: 'env', label: html`<span><${SettingOutlined} /> Environment</span>` },
    { key: 'logs', label: html`<span><${FileTextOutlined} /> Logs</span>` },
    { key: 'config', label: html`<span><${ApartmentOutlined} /> Config <span style=${{ display: 'inline-block', width: 6, height: 6, borderRadius: 99, background: '#d9a441', marginLeft: 4, verticalAlign: 'middle' }}></span></span>` },
  ];

  const body = {
    info: html`<${InfoTab} states=${states} onCopy=${onCopy} go=${go} onLogs=${onLogs} flash=${flash} setFlash=${setFlash}
      services=${services} profiles=${profiles} toggleProfile=${toggleProfile} scale=${scale} removeOrphans=${removeOrphans} act=${act} />`,
    env: html`<${EnvTab} states=${states} onCopy=${onCopy} go=${go} />`,
    logs: html`<${LogsTab} key=${logSolo || 'all'} solo=${logSolo} states=${states} />`,
    config: html`<${ConfigTab} onCopy=${onCopy} />`,
  }[tab];

  const health = allUp ? ['green', 'all running'] : up === 0 ? ['coral', 'stopped'] : ['amber', 'degraded'];

  return html`
    <${CtrsCtx.Provider} value=${ctrs}>
    <div>
      <div className="head">
        <div className="crumbs">
          <span className="link">Containers</span>
          <span>/</span>
          <span style=${{ color: '#8a8f98' }}>${PROJECT.name}</span>
        </div>

        <div className="head-row">
          <${Button} type="text" icon=${html`<${ArrowLeftOutlined} />`} aria-label="Back to containers" style=${{ marginTop: 2 }} />
          <div style=${{ flex: 1, minWidth: 240 }}>
            <div className="title">
              <${FolderOpenOutlined} style=${{ color: '#8a8f98', fontSize: 18 }} />
              ${PROJECT.name}
              <${Pill} tone="teal">compose<//>
              <${Pill} tone=${health[0]}>${health[1]}<//>
            </div>
            <div className="sub">
              <span className="copyable mono" onClick=${() => onCopy(PROJECT.workdir, 'Path')}>${PROJECT.workdir}<${CopyOutlined} /></span>
              <span className="dim">·</span>
              <span className="mono dim">${services.length} services · ${ctrs.length} containers</span>
              ${profiles.length > 0 && html`<span className="dim">·</span><span className="mono dim">profiles: ${profiles.join(', ')}</span>`}
              <span className="dim">·</span>
              <span className="mono dim">up since ${PROJECT.created.slice(0, 10)}</span>
            </div>
          </div>

          <div className="toolbar">
            ${!allUp && html`<${Button} type="primary" icon=${html`<${PlayCircleOutlined} />`}
              onClick=${() => { setAll('running'); message.success('docker compose start'); }}>
              ${up === 0 ? 'Start' : `Start ${list.length - up} stopped`}<//>`}
            <${Button} icon=${html`<${ReloadOutlined} />`} disabled=${!anyActive}
              onClick=${() => { setAll('running'); message.success('docker compose restart'); }}>Restart<//>
            <${Button} danger icon=${html`<${PoweroffOutlined} />`} disabled=${!anyActive}
              onClick=${() => { setAll('exited'); message.warning('docker compose stop'); }}>Stop<//>
            <${Dropdown} menu=${{ items: moreItems }} trigger=${['click']} placement="bottomRight">
              <${Button} icon=${html`<${MoreOutlined} />`} aria-label="More actions" />
            <//>
          </div>
        </div>

        <div className="stats">
          <div className="stat">
            <div className="k">Containers</div>
            <div className="v">${up}<small>/ ${list.length} running</small></div>
            <div className="run-bar">${ctrs.map(c => html`<${Tooltip} key=${c.key} title=${`${c.name} · ${states[c.key]}`}>
              <span style=${{ background: STATE_COLOR[states[c.key]] }}></span><//>`)}</div>
          </div>
          <div className="stat"><div className="k">CPU</div><div className="v">${cpu.toFixed(1)}%<small>sum</small></div></div>
          <div className="stat"><div className="k">Memory</div><div className="v">${mem} MB<small>${top ? `top: ${top.label} ${top.mem} MB` : ''}</small></div></div>
          <div className="stat"><div className="k">Network I/O</div><div className="v">${rx.toFixed(1)} MB / ${tx.toFixed(1)} MB</div></div>
          <div className="stat"><div className="k">Restarts</div><div className="v">${restarts}<small>worker-1: 3 in 2 min</small></div></div>
          <div className="stat"><div className="k">Volumes</div><div className="v">3<small>1.4 GB</small></div></div>
        </div>

        <${Tabs} activeKey=${tab} onChange=${k => { if (k === 'logs') setLogSolo(null); setTab(k); }} items=${tabs} style=${{ marginBottom: -1 }} />
      </div>

      <div className="page">${body}</div>
    </div>
    <//>`;
}

/* ---------- shell ---------- */
const NAV = [
  { key: 'containers', label: 'Containers', hint: '7', icon: ContainerOutlined },
  { key: 'images', label: 'Images', hint: '6', icon: PictureOutlined },
  { key: 'volumes', label: 'Volumes', hint: '5', icon: HddOutlined },
  { key: 'prefs', label: 'Preferences', hint: '', icon: SettingOutlined },
];

function Shell() {
  return html`
    <div className="app">
      <aside className="side">
        <div className="brand"><${Glyph} />Container GUI</div>
        ${NAV.map(n => html`
          <div key=${n.key} className=${'nav-item' + (n.key === 'containers' ? ' active' : '')}>
            <${n.icon} style=${{ fontSize: 14, color: n.key === 'containers' ? '#e4f222' : '#62666d' }} />
            <span style=${{ flex: 1 }}>${n.label}</span>
            ${n.hint && html`<span className="mono dim">${n.hint}</span>`}
          </div>`)}
        <div className="side-foot">
          <span className="mono">desktop-linux</span>
          <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style=${{ width: 6, height: 6, borderRadius: 99, background: '#27a644' }}></span>
            <span className="mono">7ms</span>
          </span>
        </div>
      </aside>

      <main className="main">
        <${GroupDetail} />
      </main>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  html`<${ConfigProvider} theme=${themeCfg}><${AntApp}><${Shell} /><//><//>`
);
</script>
</body>
</html>
