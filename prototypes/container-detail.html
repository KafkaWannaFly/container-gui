  .sub{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .copyable{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ash)}

  .stat .k{font-size:11px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .stat .v{font-size:15px;color:var(--bone);font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.013em}
  .stat .v small{font-size:11px;color:var(--ash);margin-left:5px}

  .section-title{font-size:12px;color:var(--fog);text-transform:uppercase;letter-spacing:.06em;margin:0}

  .label{font-size:12px;color:var(--fog);margin-bottom:4px}
  .hair{height:.5px;background:var(--graphite);border:0;margin:14px 0}

  .term-out{color:var(--mist)}
  .term-prompt{color:var(--green)}
  .term-cwd{color:var(--teal)}

const MASK = '••••••••••••••••';

/* serialise the given rows into one of the supported formats */
function serialize(kind, rows, valueOf) {
  if (kind === 'json') {
    return [
      '{',
      ...rows.map((r, i) => `  ${JSON.stringify(r.k)}: ${JSON.stringify(valueOf(r))}${i < rows.length - 1 ? ',' : ''}`),
      '}',
    ];
  }
  if (kind === 'yaml') {
    const risky = s => s === '' || /[\s#:'"{}\[\],&*?|<>=!%@`]/.test(s);
    return rows.map(r => {
      const v = valueOf(r);
      return `${r.k}: ${risky(v) ? JSON.stringify(v) : v}`;
    });
  }
  return rows.map(r => {
    const v = valueOf(r);
    return `${r.k}=${/[\s"']/.test(v) ? JSON.stringify(v) : v}`;
  });
}

/* split a serialised line into key / separator / value so it can be tinted */
function tint(kind, line, i) {
  const sep = kind === 'env' ? '=' : ':';
  const at = line.indexOf(sep);
  if (at < 0 || (kind === 'json' && !line.startsWith('  '))) {
    return html`<div key=${i} className="cv-s">${line}</div>`;
  }
  return html`<div key=${i}>
    <span className="cv-k">${line.slice(0, at)}</span>
    <span className="cv-s">${sep}</span>
    <span>${line.slice(at + 1)}</span>
  </div>`;
}

function EnvTab({ onCopy }) {
  const [q, setQ] = useState('');
  const [src, setSrc] = useState('all');
  const [revealed, setRevealed] = useState([]);
  const [view, setView] = useState('table');

  const rows = ENVS.filter(e =>
    (src === 'all' || e.src === src) &&
    (e.k.toLowerCase().includes(q.toLowerCase()) || e.v.toLowerCase().includes(q.toLowerCase()))
  );

  const toggle = k => setRevealed(r => r.includes(k) ? r.filter(x => x !== k) : [...r, k]);

  /* display honours the reveal toggles; copy always yields the real values */
  const shown = r => (r.secret && !revealed.includes(r.key) ? MASK : r.v);
  const real = r => r.v;

  const viewItems = VIEWS.map(v => ({
    key: v.key,
    label: html`<div className="view-item">
      <${v.icon} style=${{ color: view === v.key ? '#e4f222' : '#62666d', fontSize: 13 }} />
      <span className="nm">${v.label}</span>

        ? html`<${CheckOutlined} style=${{ color: '#e4f222', fontSize: 11 }} />`
        : html`<span style=${{ width: 11 }}></span>`}
      <${Tooltip} title=${`Copy as ${v.label}`} placement="right">
        <${Button} type="text" size="small" aria-label=${`Copy as ${v.label}`}
          icon=${html`<${CopyOutlined} />`}
          onClick=${e => {
            e.stopPropagation();
            const text = v.key === 'table'
              ? rows.map(r => `${r.k}\t${real(r)}\t${r.src}`).join('\n')
              : serialize(v.key, rows, real).join('\n');
            onCopy(text, `${rows.length} variables as ${v.label}`);
          }} />
      <//>
    </div>`,
    onClick: () => setView(v.key),
  }));

  const cols = [
    {
      title: 'Variable', dataIndex: 'k', width: 260,
      render: v => html`<span className="mono" style=${{ color: '#ffffff' }}>${v}</span>`,
    },
    {
      title: 'Value', dataIndex: 'v',
      render: (v, r) => {
        const hidden = r.secret && !revealed.includes(r.key);
        return html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
          <span className=${'mono env-val' + (hidden ? ' dim' : '')} title=${hidden ? '' : v}>
            ${hidden ? '••••••••••••••••' : v}
          </span>
          ${r.secret && html`<${Button} type="text" size="small" aria-label=${hidden ? 'Reveal value' : 'Hide value'}
            onClick=${() => toggle(r.key)}
            icon=${hidden ? html`<${EyeOutlined} />` : html`<${EyeInvisibleOutlined} />`} />`}
        </span>`;
      },
    },
    {
      title: 'Source', dataIndex: 'src', width: 110,
      render: v => html`<${Pill} tone=${v === 'compose' ? 'teal' : v === 'runtime' ? 'lav' : 'neutral'}>${v}<//>`,
    },
    {
      title: '', key: 'act', width: 46, align: 'right',
      render: (_, r) => html`<${Tooltip} title="Copy KEY=value">
        <${Button} type="text" size="small" icon=${html`<${CopyOutlined} />`}
          onClick=${() => onCopy(`${r.k}=${r.v}`, r.k)} />
      <//>`,
    },
  ];

  return html`
    <div className="card">
      <div className="toolbar" style=${{ marginBottom: 14 }}>
        <${Input} placeholder="Filter variables" allowClear value=${q} onChange=${e => setQ(e.target.value)}
          prefix=${html`<${SearchOutlined} style=${{ color: '#62666d' }} />`} style=${{ width: 260 }} />
        <${Segmented} value=${src} onChange=${setSrc} options=${[
          { label: 'All', value: 'all' },
          { label: 'Compose', value: 'compose' },
          { label: 'Image', value: 'image' },
          { label: 'Runtime', value: 'runtime' },
        ]} />
        <span className="spacer"></span>
        <span className="dim" style=${{ fontSize: 12 }}>${rows.length} of ${ENVS.length}</span>
        <${Button} icon=${html`<${EyeOutlined} />`}
          onClick=${() => setRevealed(r => r.length ? [] : ENVS.filter(e => e.secret).map(e => e.key))}>
          ${revealed.length ? 'Hide secrets' : 'Reveal secrets'}
        <//>
        <${Dropdown} menu=${{ items: viewItems }} trigger=${['click']} placement="bottomRight">
          <${Button}>
            View as: ${VIEWS.find(v => v.key === view).label} <${DownOutlined} style=${{ fontSize: 10 }} />
          <//>
        <//>
      </div>

      ${view === 'table'
        ? html`<${Table} size="small" columns=${cols} dataSource=${rows} pagination=${false}
            locale=${{ emptyText: html`<${Empty} description="No matching variables" />` }} />`
        : rows.length === 0
          ? html`<${Empty} description="No matching variables" />`
          : html`<pre className="code-view">
              ${serialize(view, rows, shown).map((line, i) => tint(view, line, i))}
            </pre>`}

      <div className="toolbar" style=${{ marginTop: 12 }}>
        <span className="dim" style=${{ fontSize: 12 }}>

          Reflects the current filter${revealed.length < ENVS.filter(e => e.secret).length ? ' · secrets masked' : ''}.
        </span>`}
      </div>
    </div>`;
}

/* ---------- Logs tab ---------- */
const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

function LogsTab() {
  const [q, setQ] = useState('');
  const [level, setLevel] = useState('all');
  const [follow, setFollow] = useState(true);
  const [timestamps, setTimestamps] = useState(true);
  const [wrap, setWrap] = useState(true);
  const [tail, setTail] = useState('500');
  const [cleared, setCleared] = useState(0);
  const boxRef = useRef(null);

  const rank = { debug: 0, info: 1, warn: 2, error: 3 };
  const rows = useMemo(() => LOGS
    .slice(cleared)
    .filter(([, lv, msg]) =>
      (level === 'all' || rank[lv] >= rank[level]) &&
      (!q || msg.toLowerCase().includes(q.toLowerCase()))
    ), [q, level, cleared]);

  useEffect(() => { if (follow && boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [rows, follow]);

  const counts = LOGS.reduce((a, [, lv]) => ({ ...a, [lv]: (a[lv] || 0) + 1 }), {});

  const renderMsg = msg => {
    if (!q) return msg;
    const i = msg.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return msg;
    return html`${msg.slice(0, i)}<span className="hl">${msg.slice(i, i + q.length)}</span>${msg.slice(i + q.length)}`;
  };

  return html`
    <div className="card">
      <div className="toolbar" style=${{ marginBottom: 12 }}>
        <${Input} placeholder="Search in logs" allowClear value=${q} onChange=${e => setQ(e.target.value)}
          prefix=${html`<${SearchOutlined} style=${{ color: '#62666d' }} />`} style=${{ width: 240 }} />
        <${Segmented} value=${level} onChange=${setLevel} options=${[
          { label: 'All', value: 'all' },
          { label: `Info`, value: 'info' },
          { label: `Warn ${counts.warn || 0}`, value: 'warn' },
          { label: `Error ${counts.error || 0}`, value: 'error' },
        ]} />
        <${Select} value=${tail} onChange=${setTail} style=${{ width: 116 }} options=${[
          { value: '100', label: 'Last 100' },
          { value: '500', label: 'Last 500' },
          { value: '5000', label: 'Last 5000' },
          { value: 'all', label: 'All lines' },
        ]} />
        <span className="spacer"></span>
        <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <${Switch} size="small" checked=${timestamps} onChange=${setTimestamps} />
          <span className="dim" style=${{ fontSize: 12 }}>Timestamps</span>
        </span>
        <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <${Switch} size="small" checked=${wrap} onChange=${setWrap} />
          <span className="dim" style=${{ fontSize: 12 }}>Wrap</span>
        </span>
        <${Button} icon=${html`<${VerticalAlignBottomOutlined} />`} type=${follow ? 'primary' : 'default'}
          onClick=${() => setFollow(f => !f)}>Follow<//>
        <${Button} icon=${html`<${ClearOutlined} />`} onClick=${() => setCleared(LOGS.length)}>Clear<//>
        <${Button} icon=${html`<${DownloadOutlined} />`}>Download<//>
      </div>

      <pre className="logs" ref=${boxRef} style=${{ whiteSpace: wrap ? 'pre-wrap' : 'pre' }}>
        ${rows.length === 0
          ? html`<span className="dim">No log lines match the current filter.</span>`
          : rows.map(([ts, lv, msg], i) => html`<div key=${i} className=${'lg-' + lv}>
              ${timestamps && html`<span className="lg-ts" title=${`${ts} (UTC)`}>${dayjs(ts).format('YYYY-MM-DD HH:mm:ss.SSS')} </span>`}
              <span className="lg-lvl">${lv.toUpperCase()}</span>
              <span> ${renderMsg(msg)}</span>
            </div>`)}
      </pre>

      <div className="toolbar" style=${{ marginTop: 10 }}>
        <span className="dim" style=${{ fontSize: 12 }}>
          ${rows.length} lines${q || level !== 'all' ? ` (filtered from ${LOGS.length - cleared})` : ''}
          ${timestamps && ` · times in ${LOCAL_TZ} (UTC${dayjs().format('Z')})`}
        </span>
        <span className="spacer"></span>
        <span className="dim" style=${{ fontSize: 12 }}>
          ${follow ? 'Following — auto-scroll pauses when you scroll up.' : 'Paused — new lines are buffered.'}
        </span>
      </div>
    </div>`;
}

/* ---------- path helpers ---------- */
const join = (dir, name) => (dir === '/' ? '/' : dir + '/') + name;
const parentOf = p => p.slice(0, p.lastIndexOf('/')) || '/';
const ancestors = p => p === '/' ? ['/'] : ['/', ...p.slice(1).split('/').map((_, i, a) => '/' + a.slice(0, i + 1).join('/'))];
const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;
const sortKids = kids => [...kids].sort((a, b) => (a.type === 'dir' ? 0 : 1) - (b.type === 'dir' ? 0 : 1) || a.name.localeCompare(b.name));
const mountFor = p => MOUNTS.find(m => p === m.target || p.startsWith(m.target + '/'));

function normalize(p) {
  const out = [];
  for (const s of p.split('/')) {
    if (!s || s === '.') continue;
    if (s === '..') out.pop(); else out.push(s);
  }
  return '/' + out.join('/');
}
const absPath = p => normalize(p.startsWith('/') ? p : '/' + p);

/* find the node at a path without following a link in the final segment */
function lookup(path) {
  let node = FS;
  let cur = '/';
  for (const seg of normalize(path).split('/').filter(Boolean)) {
    if (node.type === 'link') {
      const r = resolve(cur);
      if (!r) return null;
      ({ node, path: cur } = r);
    }
    if (node.type !== 'dir') return null;
    const next = node.children.find(c => c.name === seg);
    if (!next) return null;
    node = next;
    cur = join(cur, seg);
  }
  return { node, path: cur };
}

/* like lookup, but follows symlinks to their final target */
function resolve(path, hops = 0) {
  const hit = lookup(path);
  if (!hit || hit.node.type !== 'link') return hit;
  if (hops > 8) return null;
  const t = hit.node.target;
  return resolve(t.startsWith('/') ? t : normalize(join(parentOf(hit.path), t)), hops + 1);
}

function lsOut(node, long, all) {
  const kids = sortKids(node.children).filter(c => all || !c.name.startsWith('.'));
  if (!long) return kids.length ? [kids.map(c => c.name).join('  ')] : [];
  const rows = all ? [{ ...node, name: '.' }, { ...node, name: '..' }, ...kids] : kids;
  return [
    `total ${kids.length * 4}`,
    ...rows.map(c => `${c.mode} ${String(c.type === 'dir' ? 2 : 1).padStart(4)} ${c.owner.padEnd(8)} ${c.owner.padEnd(8)} ${String(c.size).padStart(9)} ${c.mtime} ${c.name}${c.type === 'link' ? ' -> ' + c.target : ''}`),
  ];
}

/* turn a history CreatedBy string back into a Dockerfile instruction */
function toInstruction(by) {
  let s = by.replace(/\s+# buildkit$/, '').trim();
  s = s.replace(/^\/bin\/sh -c #\(nop\)\s+/, '');
  if (s.startsWith('/bin/sh -c ')) s = 'RUN ' + s.slice(11);
  s = s.replace(/^RUN \/bin\/sh -c /, 'RUN ');
  s = s.replace(/^(CMD|ENTRYPOINT) \[(.*)\]$/, (_, k, a) => `${k} [${a.replace(/" "/g, '", "')}]`);
  s = s.replace(/^EXPOSE map\[(.*)\]$/, (_, m) => 'EXPOSE ' + m.replace(/:\{\}/g, ''));
  s = s.replace(/^ADD (file:[0-9a-f]+) in /, 'ADD $1 ');
  return s.startsWith('RUN ') ? s.split(' && ').join(' \\\n    && ') : s;
}

          : html`<${Table} size="small" pagination=${false} dataSource=${HISTORY} columns=${layerCols}
              expandable=${{
                expandedRowRender: r => html`<pre className="code-view" style=${{ minHeight: 0, margin: 0 }}>${r.by}</pre>`,
              }} />`}

        <div className="toolbar" style=${{ marginTop: 10 }}>
          <span className="dim" style=${{ fontSize: 12 }}><${Mono}>docker history --no-trunc ${IMAGE.name}<//></span>
          <span className="spacer"></span>
          <span className="dim" style=${{ fontSize: 12 }}>${fmtSize(IMAGE.size)} · ${HISTORY.length} layers</span>
        </div>
      </div>
    </div>`;
}

/* ---------- Files tab ---------- */
function fsTreeNode(node, path, showHidden) {
  const isDir = node.type === 'dir';
  const kids = isDir ? sortKids(node.children).filter(c => showHidden || !c.name.startsWith('.')) : [];
  const m = MOUNTS.find(x => x.target === path);
  return {
    key: path,
    fs: node,
    isLeaf: kids.length === 0,
    icon: path === '/' ? html`<${HddOutlined} />`
      : isDir ? ({ expanded }) => html`<${expanded ? FolderOpenOutlined : FolderOutlined} />`
      : html`<${FsIcon} node=${node} />`,
    title: html`<span className="fs-name">
      <span className="mono" style=${isDir ? null : { color: '#8a8f98' }}>${node.name || '/'}</span>
      ${m && html`<${Pill} tone=${MOUNT_TONE[m.type]}>${m.type}<//>`}
      ${node.diff && html`<span title=${node.diff === 'A' ? 'added' : 'changed'} style=${{
        width: 6, height: 6, borderRadius: 99, flex: '0 0 auto', background: node.diff === 'A' ? '#27a644' : '#d9a441',
      }}></span>`}
    </span>`,
    children: kids.map(c => fsTreeNode(c, join(path, c.name), showHidden)),
  };
}

function FsIcon({ node }) {
  if (node.type === 'dir') return html`<${FolderOutlined} style=${{ color: '#8a8f98' }} />`;
  if (node.type === 'link') return html`<${LinkOutlined} style=${{ color: '#02b8cc' }} />`;
  if (node.type === 'dev') return html`<${ApiOutlined} style=${{ color: '#62666d' }} />`;
  if (node.binary) return html`<${FileOutlined} style=${{ color: '#62666d' }} />`;
  return html`<${FileTextOutlined} style=${{ color: '#8a8f98' }} />`;
}

function DiffPill({ diff }) {
  return html`<${Tooltip} title=${diff === 'A' ? 'Added since the image was built' : 'Changed since the image was built'}>
    <span><${Pill} tone=${diff === 'A' ? 'green' : 'amber'}>${diff === 'A' ? 'added' : 'changed'}<//></span>
  <//>`;
}

function FsNote({ icon, title, sub, children }) {
  return html`<div className="fs-empty">
    <${icon} style=${{ fontSize: 22, color: '#62666d' }} />
    <div style=${{ color: '#e5e5e6' }}>${title}</div>
    ${sub && html`<div className="dim" style=${{ fontSize: 12, maxWidth: 400 }}>${sub}</div>`}
    ${children && html`<div style=${{ marginTop: 6 }}>${children}</div>`}
  </div>`;
}

function FilesTab({ onCopy, onOpenLogs }) {
  const { message } = AntApp.useApp();
  const [cwd, setCwd] = useState('/');
  const [open, setOpen] = useState(null);
  const [expanded, setExpanded] = useState(['/']);
  const [q, setQ] = useState('');
  const [showHidden, setShowHidden] = useState(false);
  const [wrap, setWrap] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const bodyRef = useRef(null);
  const tree = useMemo(() => [fsTreeNode(FS, '/', showHidden)], [showHidden]);

  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTo(0, 0); }, [cwd, open]);

  const expandTo = p => setExpanded(e => [...new Set([...e, ...ancestors(p)])]);
  const go = p => { setCwd(p); setOpen(null); setQ(''); expandTo(p); };

  /* open whatever sits at a path — dirs (and links to dirs) navigate, files preview.
     A link to a file stays selected where it lives; the viewer shows its target. */
  const visit = p => {
    const hit = resolve(p);
    if (!hit) { message.warning(`${p} is a broken link`); return; }
    if (hit.node.type === 'dir') { go(hit.path); return; }
    const parent = parentOf(p);
    setCwd(parent);
    expandTo(parent);
    setOpen(p);
    setRevealed(false);
  };

  const dirNode = lookup(cwd).node;
  const hiddenCount = dirNode.children.filter(c => c.name.startsWith('.')).length;
  const rows = sortKids(dirNode.children)
    .filter(c => showHidden || !c.name.startsWith('.'))
    .filter(c => !q || c.name.toLowerCase().includes(q.toLowerCase()))
    .map(c => ({ key: join(cwd, c.name), path: join(cwd, c.name), node: c }));

  const opened = open && lookup(open).node;
  const link = opened && opened.type === 'link' ? opened : null;
  const target = link && resolve(open);
  const node = link ? target.node : opened;
  const isText = node && node.type === 'file' && !node.binary;
  const lines = isText ? node.content.replace(/\n$/, '').split('\n') : [];
  const mount = mountFor(open || cwd);
  const shownPath = open || cwd;
  const segs = shownPath === '/' ? [] : shownPath.slice(1).split('/');
  const changed = (function count(n) { return n.children.reduce((a, c) => a + (c.diff ? 1 : 0) + (c.children ? count(c) : 0), 0); })(FS);

  const download = f => {
    if (f.binary) { message.info(`Would run docker cp to save ${f.name}`); return; }
    const url = URL.createObjectURL(new Blob([f.content]));
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };

  /* per-row menu; links act on their target, the wrapper keeps clicks from opening the row */
  const rowMenu = r => {
    const hit = resolve(r.path);
    const f = hit && hit.node.type === 'file' ? hit.node : null;
    return html`<span onClick=${e => e.stopPropagation()} onKeyDown=${e => e.stopPropagation()}>
      <${Dropdown} trigger=${['click']} placement="bottomRight" menu=${{
        items: [
          { key: 'path', label: 'Copy path', icon: html`<${CopyOutlined} />` },
          { key: 'content', label: 'Copy contents', icon: html`<${FileTextOutlined} />`, disabled: !f || f.binary || !f.content },
          { key: 'download', label: 'Download', icon: html`<${DownloadOutlined} />`, disabled: !f },
        ],
        onClick: ({ key }) => {
          if (key === 'path') onCopy(r.path, 'Path');
          if (key === 'content') onCopy(f.content, f.name);
          if (key === 'download') download(f);
        },
      }}>
        <${Button} className="fs-act" type="text" size="small" icon=${html`<${MoreOutlined} />`}
          aria-label=${`Actions for ${r.node.name}`} />
      <//>
    </span>`;
  };

  const cols = [
    {
      title: 'Name', key: 'name',
      render: (_, r) => html`<span className="fs-name">
        <${FsIcon} node=${r.node} />
        <span className="mono" style=${{ color: r.node.type === 'dir' ? '#ffffff' : '#d0d6e0' }}>${r.node.name}</span>
        ${r.node.type === 'link' && html`<span className="mono dim">→ ${r.node.target}</span>`}
        ${MOUNTS.some(m => m.target === r.path) && html`<${Pill} tone=${MOUNT_TONE[mountFor(r.path).type]}>${mountFor(r.path).type}<//>`}
        ${r.node.diff && html`<${DiffPill} diff=${r.node.diff} />`}
      </span>`,
    },
    {
      title: 'Size', key: 'size', width: 100, align: 'right',
      render: (_, r) => r.node.type === 'dir' ? html`<span className="dim">—</span>` : html`<span className="mono dim">${fmtSize(r.node.size)}</span>`,
    },
    { title: 'Permissions', key: 'mode', width: 120, render: (_, r) => html`<span className="mono dim">${r.node.mode}</span>` },
    { title: 'Owner', key: 'owner', width: 80, render: (_, r) => html`<span className="mono dim">${r.node.owner}</span>` },
    { title: 'Modified', key: 'mtime', width: 120, render: (_, r) => html`<span className="mono dim">${r.node.mtime}</span>` },
    { title: '', key: 'act', width: 44, align: 'right', render: (_, r) => rowMenu(r) },
  ];

  const listing = dirNode.virtual
    ? html`<${FsNote} icon=${FolderOutlined} title=${`${cwd} is a virtual ${dirNode.virtual} mount`}
        sub="Its contents are generated by the kernel on read and are not listed here. Use the Exec tab to inspect it." />`
    : html`<${Table} size="small" columns=${cols} dataSource=${rows} pagination=${false}
        onRow=${r => ({ onClick: () => visit(r.path), onKeyDown: e => e.key === 'Enter' && visit(r.path), tabIndex: 0 })}
        locale=${{ emptyText: html`<${Empty} image=${Empty.PRESENTED_IMAGE_SIMPLE}
          description=${q ? 'No matching entries' : hiddenCount && !showHidden ? `Only hidden files (${hiddenCount})` : 'Empty directory'} />` }} />`;

  const viewer = () => {
    if (node.type === 'dev') {
      return node.stream
        ? html`<${FsNote} icon=${ApiOutlined} title=${`/dev/${node.name} is the container's ${node.stream} stream`}
            sub="Output written here is captured by the Docker logging driver, not stored as a file.">
            <${Button} icon=${html`<${FileTextOutlined} />`} onClick=${onOpenLogs}>Open Logs tab<//>
          <//>`
        : html`<${FsNote} icon=${ApiOutlined} title="Character device" sub="Device nodes have no readable content." />`;
    }
    if (node.binary) {
      return html`<${FsNote} icon=${FileOutlined} title=${`Binary file · ${fmtSize(node.size)}`}
          sub="Preview is only available for text files.">
          <${Button} icon=${html`<${DownloadOutlined} />`} onClick=${() => download(node)}>Download<//>
        <//>`;
    }
    if (node.content === '') return html`<${FsNote} icon=${FileOutlined} title="Empty file" sub="0 bytes" />`;
    if (node.sensitive && !revealed) {
      return html`<${FsNote} icon=${LockOutlined} title=${`${node.name} may contain secrets`}
          sub="Contents stay hidden until you reveal them. Download and the row menu still use the real file.">
          <${Button} icon=${html`<${EyeOutlined} />`} onClick=${() => setRevealed(true)}>Reveal contents<//>
        <//>`;
    }
    return html`<div className="fs-code" style=${wrap ? null : { width: 'max-content', minWidth: '100%' }}>
      ${lines.map((ln, i) => html`<div key=${i} className="fs-ln">
        <span className="n">${i + 1}</span>
        <span className=${'t' + (/^\s*#/.test(ln) ? ' fs-c' : '')}
          style=${{ whiteSpace: wrap ? 'pre-wrap' : 'pre', wordBreak: wrap ? 'break-word' : 'normal' }}>${ln || ' '}</span>
      </div>`)}
    </div>`;
  };

  return html`
    <div className="card">
      <div className="fs">
        <div className="fs-tree">
          <${Tree} showIcon blockNode treeData=${tree}
            expandedKeys=${expanded} onExpand=${keys => setExpanded(keys)}
            selectedKeys=${[open || cwd]} onSelect=${(_, info) => visit(info.node.key)}
            titleRender=${d => html`<span className="fs-tnode">${d.title}${rowMenu({ path: d.key, node: d.fs })}</span>`} />
        </div>

        <div className="fs-main">
          <div className="fs-bar">
            <div className="fs-crumb mono">
              <span className=${'seg' + (shownPath === '/' ? ' cur' : '')} onClick=${() => go('/')}>/</span>
              ${segs.map((s, i) => {
                const p = '/' + segs.slice(0, i + 1).join('/');
                const last = i === segs.length - 1;
                return html`<${React.Fragment} key=${p}>
                  ${i > 0 && html`<span className="sep">/</span>`}
                  <span className=${'seg' + (last ? ' cur' : '')} onClick=${() => !last && go(p)}>${s}</span>
                <//>`;
              })}
            </div>

            ${node
              ? html`
                ${isText && node.content && html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6, marginRight: 4 }}>
                  <${Switch} size="small" checked=${wrap} onChange=${setWrap} />
                  <span className="dim" style=${{ fontSize: 12 }}>Wrap</span>
                </span>`}
                ${node.type === 'file' && html`<${Button} size="small" icon=${html`<${DownloadOutlined} />`} onClick=${() => download(node)}>Download<//>`}`
              : html`
                <${Input} size="small" placeholder="Filter" allowClear value=${q} onChange=${e => setQ(e.target.value)}
                  prefix=${html`<${SearchOutlined} style=${{ color: '#62666d' }} />`} style=${{ width: 170 }} />
                <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                  <${Switch} size="small" checked=${showHidden} onChange=${setShowHidden} />
                  <span className="dim" style=${{ fontSize: 12 }}>Hidden</span>
                </span>
                <${Tooltip} title="Parent folder">
                  <${Button} type="text" size="small" icon=${html`<${ArrowUpOutlined} />`} aria-label="Parent folder"
                    disabled=${cwd === '/'} onClick=${() => go(parentOf(cwd))} />
                <//>`}
          </div>

          ${link && html`<div className="fs-meta mono">
            <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6, color: '#02b8cc' }}>
              <${LinkOutlined} /> symlink → ${link.target}
            </span>
            <${Button} type="text" size="small" onClick=${() => visit(target.path)}>Go to ${target.path}<//>
          </div>`}
          ${node && html`<div className="fs-meta mono">
            <span>${node.mode}</span>
            <span>${node.owner}:${node.owner}</span>
            <span>${fmtSize(node.size)}</span>
            ${isText && node.content && html`<span>${lines.length} lines</span>`}
            <span>modified ${node.mtime}</span>
            ${node.diff && html`<${DiffPill} diff=${node.diff} />`}
            ${mount && html`<span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              <${Pill} tone=${MOUNT_TONE[mount.type]}>${mount.type}<//>
              ${mount.source !== '—' ? mount.source : mount.target} (${mount.mode})
            </span>`}
          </div>`}

          <div className="fs-body" ref=${bodyRef}>${node ? viewer() : listing}</div>
        </div>
      </div>

      <div className="toolbar" style=${{ marginTop: 10 }}>
        <span className="dim" style=${{ fontSize: 12 }}>
          <${Mono}>docker cp ${link ? '-L ' : ''}${CTR.name}:${shownPath} .<//>
        </span>
        <span className="spacer"></span>
        <span className="dim" style=${{ fontSize: 12 }}>
          Read-only · ${changed} paths differ from the image
        </span>
      </div>
    </div>`;
}

/* ---------- Exec tab ---------- */
const PS_OUT = [
  'PID   USER     TIME  COMMAND',
  '    1 root      0:04 nginx: master process nginx -g daemon off;',
  '   29 nginx     0:11 nginx: worker process',
  '   30 nginx     0:09 nginx: worker process',
  '   31 nginx     0:12 nginx: worker process',
  '   32 nginx     0:08 nginx: worker process',
  '   44 root      0:00 sh',
  '   51 root      0:00 ps',
];

function ExecTab() {
  const [shell, setShell] = useState('/bin/sh');
  const [user, setUser] = useState('root');
  const [connected, setConnected] = useState(true);
  const [lines, setLines] = useState([
    { t: 'sys', s: `Attached to ${CTR.shortId} — ${'/bin/sh'} as root` },
    { t: 'sys', s: 'Type "help" for the commands this prototype fakes.' },
  ]);
  const [cmd, setCmd] = useState('');
  const [past, setPast] = useState([]);
  const [ptr, setPtr] = useState(-1);
  const boxRef = useRef(null);
  const inRef = useRef(null);

  useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [lines]);

  const push = (arr, t) => setLines(l => [...l, ...(Array.isArray(arr) ? arr : [arr]).map(s => ({ t: t || 'out', s }))]);

  const reconnect = () => {
    setConnected(true);
    setLines([{ t: 'sys', s: `Attached to ${CTR.shortId} — ${shell} as ${user}` }]);
  };

  const run = raw => {
    const line = raw.trim();
    setLines(l => [...l, { t: 'cmd', s: raw }]);
    if (line) { setPast(p => [...p, line]); setPtr(-1); }
    if (!line) return;

    const [bin, ...args] = line.split(/\s+/);
    switch (bin) {
      case 'help':
        push([
          'Faked in this prototype:',
          '  ls [-la] [path]   cat <file>   pwd        whoami',
          '  env   ps   id     uname -a     date       hostname',
          '  df -h   nginx -t  clear        exit',
        ]); break;
      case 'clear': setLines([]); break;
      case 'exit':
        push('session ended', 'sys'); setConnected(false); break;
      case 'ls': {
        const flags = args.filter(a => a.startsWith('-')).join('');
        const target = args.find(a => !a.startsWith('-')) || '/';
        const hit = resolve(absPath(target));
        if (!hit) { push(`ls: ${target}: No such file or directory`, 'err'); break; }
        push(hit.node.type === 'dir' ? lsOut(hit.node, flags.includes('l'), flags.includes('a')) : [target]);
        break;
      }
      case 'pwd': push('/'); break;
      case 'whoami': push(user); break;
      case 'id': push(user === 'root' ? 'uid=0(root) gid=0(root) groups=0(root)' : 'uid=101(nginx) gid=101(nginx) groups=101(nginx)'); break;
      case 'hostname': push(CTR.shortId); break;
      case 'uname': push('Linux a91f3c2d8e04 6.10.4-linuxkit #1 SMP Thu Sep 4 12:00:00 UTC 2026 x86_64 Linux'); break;
      case 'date': push(dayjs().format('ddd MMM D HH:mm:ss [UTC] YYYY')); break;
      case 'env': push(ENVS.map(e => `${e.k}=${e.v}`)); break;
      case 'ps': push(PS_OUT); break;
      case 'df': push([
        'Filesystem                Size      Used Available Use% Mounted on',
        'overlay                  58.4G     21.2G     34.2G  38% /',
        'tmpfs                    64.0M         0     64.0M   0% /dev',
        '/dev/vda1                58.4G     21.2G     34.2G  38% /etc/hosts',
        'tmpfs                   256.0M    120.0K    255.9M   0% /var/cache/nginx',
      ]); break;
      case 'nginx':
        if (args[0] === '-t') push([
          'nginx: the configuration file /etc/nginx/nginx.conf syntax is ok',
          'nginx: configuration file /etc/nginx/nginx.conf test is successful',
        ]);
        else push(`nginx version: nginx/1.27.1`);
        break;
      case 'cat': {
        if (!args[0]) { push('cat: missing operand', 'err'); break; }
        const hit = resolve(absPath(args[0]));
        if (!hit) push(`cat: can't open '${args[0]}': No such file or directory`, 'err');
        else if (hit.node.type === 'dir') push('cat: read error: Is a directory', 'err');
        else if (hit.node.binary) push(`(binary output suppressed, ${fmtSize(hit.node.size)})`, 'sys');
        else if (hit.node.content) push(hit.node.content.replace(/\n$/, '').split('\n'));
        break;
      }
      case 'rm':
        push('rm: prototype is read-only — nothing was deleted', 'err'); break;
      default:
        push(`sh: ${bin}: not found`, 'err');
    }
  };

  const onKey = e => {
    if (e.key === 'Enter') { run(cmd); setCmd(''); }
    else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!past.length) return;
      const n = ptr < 0 ? past.length - 1 : Math.max(0, ptr - 1);
      setPtr(n); setCmd(past[n]);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (ptr < 0) return;
      const n = ptr + 1;
      if (n >= past.length) { setPtr(-1); setCmd(''); } else { setPtr(n); setCmd(past[n]); }
    } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); setLines([]); }
  };

  const prompt = html`<span><span className="term-prompt">${user}@${CTR.shortId}</span><span className="dim">:</span><span className="term-cwd">/</span><span className="dim">${user === 'root' ? '#' : '$'}</span></span>`;

  return html`
    <div className="card">
      <div className="toolbar" style=${{ marginBottom: 12 }}>
        <span className="label" style=${{ margin: 0 }}>Shell</span>
        <${Select} value=${shell} onChange=${setShell} disabled=${connected} style=${{ width: 150 }} options=${[
          { value: '/bin/sh', label: '/bin/sh' },
          { value: '/bin/bash', label: '/bin/bash' },
          { value: '/bin/ash', label: '/bin/ash' },
        ]} />
        <span className="label" style=${{ margin: '0 0 0 8px' }}>User</span>
        <${Select} value=${user} onChange=${setUser} disabled=${connected} style=${{ width: 130 }} options=${[
          { value: 'root', label: 'root' },
          { value: 'nginx', label: 'nginx' },
        ]} />
        <span className="spacer"></span>
        <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
          <${StateDot} state=${connected ? 'running' : 'exited'} size=${7} />
          <span className="mono dim">${connected ? 'attached' : 'detached'}</span>
        </span>
        <${Button} icon=${html`<${ClearOutlined} />`} onClick=${() => setLines([])}>Clear<//>
        ${connected
          ? html`<${Button} danger icon=${html`<${DisconnectOutlined} />`} onClick=${() => { setConnected(false); push('session ended', 'sys'); }}>Disconnect<//>`
          : html`<${Button} type="primary" icon=${html`<${CodeOutlined} />`} onClick=${reconnect}>Reconnect<//>`}
      </div>

      <div className="term" ref=${boxRef} onClick=${() => inRef.current && inRef.current.focus()}>
        ${lines.map((l, i) => html`<div key=${i} className=${'term-line term-' + (l.t === 'cmd' ? 'out' : l.t)}>
          ${l.t === 'cmd' ? html`<span>${prompt} ${l.s}</span>` : l.s}
        </div>`)}
        ${connected && html`
          <div className="term-inrow">
            ${prompt}
            <input ref=${inRef} className="term-in" value=${cmd} spellCheck=${false} autoFocus
              aria-label="Terminal input"
              onChange=${e => setCmd(e.target.value)} onKeyDown=${onKey} />
          </div>`}
        ${!connected && html`<div className="term-line dim">Session closed. Press Reconnect to start a new one.</div>`}
      </div>

      <div className="toolbar" style=${{ marginTop: 10 }}>
        <span className="dim" style=${{ fontSize: 12 }}>
          <${Mono}>docker exec -it ${CTR.shortId} ${shell}<//>
        </span>
        <span className="spacer"></span>
        <span className="dim" style=${{ fontSize: 12 }}>↑ ↓ history · Ctrl+L clear · type "help"</span>
      </div>
    </div>`;
}

/* ---------- detail page ---------- */
function ContainerDetail() {
  const { modal, message } = AntApp.useApp();
  const [tab, setTab] = useState('info');
  const [state, setState] = useState('running');

  const onCopy = (text, what) => {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    message.success(`${what} copied`);
  };

  const running = state === 'running';
  const paused = state === 'paused';

  const remove = () => modal.confirm({
    title: 'Remove container?', centered: true, okText: 'Remove', okType: 'danger',
    content: html`<span><${Mono}>${CTR.name}<//> will be stopped and deleted. Named volumes are kept.</span>`,
  });

  /* menu label with an explanation shown to the left on hover; offset clears the item icon + padding */
  const tip = (label, title) => html`<${Tooltip} title=${title} placement="left" mouseEnterDelay=${0.3} align=${{ offset: [-40, 0] }}>
    <span style=${{ display: 'block' }}>${label}</span>
  <//>`;

  const moreItems = [
    { key: 'kill', icon: html`<${PoweroffOutlined} />`, disabled: !running,
      label: tip('Kill', 'Sends SIGKILL: processes end immediately with no graceful shutdown. Use it when Stop hangs.'),
      onClick: () => { setState('exited'); message.warning('Container killed'); } },
    { key: 'copy-id', icon: html`<${CopyOutlined} />`,
      label: tip('Copy full ID', `Copies the 64-character container ID. The header shows the 12-character short form (${CTR.shortId}).`),
      onClick: () => onCopy(CTR.id, 'Container ID') },
    { key: 'inspect', icon: html`<${FileTextOutlined} />`,
      label: tip('Copy inspect JSON', 'Copies the full docker inspect output: config, state, mounts, networks, env and labels. Env values are not masked.'),
      onClick: () => onCopy('{ "Id": "' + CTR.id + '" }', 'Inspect JSON') },
    { type: 'divider' },
    { key: 'remove', icon: html`<${DeleteOutlined} />`, danger: true,
      label: tip('Remove', 'Stops and deletes the container. Named volumes are kept.'),
      onClick: remove },
  ];

  const tabs = [
    { key: 'info', label: html`<span><${InfoCircleOutlined} /> Info</span>`, children: html`<${InfoTab} onCopy=${onCopy} />` },
    { key: 'image', label: html`<span><${PictureOutlined} /> Image</span>`, children: html`<${ImageTab} onCopy=${onCopy} />` },
    { key: 'env', label: html`<span><${SettingOutlined} /> Environment</span>`, children: html`<${EnvTab} onCopy=${onCopy} />` },
    { key: 'logs', label: html`<span><${FileTextOutlined} /> Logs</span>`, children: html`<${LogsTab} />` },
    { key: 'files', label: html`<span><${FolderOutlined} /> Files</span>`, children: html`<${FilesTab} onCopy=${onCopy} onOpenLogs=${() => setTab('logs')} />` },
    { key: 'exec', label: html`<span><${CodeOutlined} /> Exec</span>`, children: html`<${ExecTab} />` },
  ];

  const stats = running ? CTR.stats : { cpu: '0.0%', mem: '0 MB', memPct: '0%', net: '— / —', block: '— / —', pids: 0 };

  return html`
    <div>
      <div className="head">
        <div className="crumbs">
          <span className="link">Containers</span>
          <span>/</span>
          <span style=${{ color: '#8a8f98' }}>${CTR.name}</span>
        </div>

        <div className="head-row">
          <${Button} type="text" icon=${html`<${ArrowLeftOutlined} />`} aria-label="Back to containers"
            style=${{ marginTop: 2 }} />
          <div style=${{ flex: 1, minWidth: 240 }}>
            <div className="title">
              <${StateDot} state=${state} size=${9} />
              ${CTR.name}
              ${CTR.compose && html`<${Pill} tone="teal">${CTR.compose.project}/${CTR.compose.service}<//>`}
              ${running && html`<${Pill} tone="green">healthy<//>`}
            </div>
            <div className="sub">
              <${Mono}>${CTR.image}<//>
              <span className="dim">·</span>
              <span className="copyable mono" onClick=${() => onCopy(CTR.id, 'Container ID')}>
                ${CTR.shortId}<${CopyOutlined} />
              </span>
              <span className="dim">·</span>
              <span className="mono dim">${running ? `up ${CTR.uptime}` : state === 'paused' ? 'paused' : 'exited (0) 2 minutes ago'}</span>
            </div>
          </div>

          <div className="toolbar">
            ${running
              ? html`<${Button} icon=${html`<${PauseCircleOutlined} />`} onClick=${() => { setState('paused'); message.info('Container paused'); }}>Pause<//>`
              : paused
                ? html`<${Button} icon=${html`<${PlayCircleOutlined} />`} onClick=${() => { setState('running'); message.success('Container unpaused'); }}>Unpause<//>`
                : html`<${Button} type="primary" icon=${html`<${PlayCircleOutlined} />`} onClick=${() => { setState('running'); message.success('Container started'); }}>Start<//>`}
            <${Button} icon=${html`<${ReloadOutlined} />`} disabled=${!running && !paused}
              onClick=${() => { setState('running'); message.success('Container restarted'); }}>Restart<//>
            <${Button} danger icon=${html`<${PoweroffOutlined} />`} disabled=${!running && !paused}
              onClick=${() => { setState('exited'); message.warning('Container stopped'); }}>Stop<//>
            <${Dropdown} menu=${{ items: moreItems }} trigger=${['click']} placement="bottomRight">
              <${Button} icon=${html`<${MoreOutlined} />`} aria-label="More actions" />
            <//>
          </div>
        </div>

        <div className="stats">
          <div className="stat"><div className="k">CPU</div><div className="v">${stats.cpu}<small>/ 1.50 cpus</small></div></div>
          <div className="stat"><div className="k">Memory</div><div className="v">${stats.mem}<small>${stats.memPct} of 512 MB</small></div></div>
          <div className="stat"><div className="k">Network I/O</div><div className="v">${stats.net}</div></div>
          <div className="stat"><div className="k">Block I/O</div><div className="v">${stats.block}</div></div>
          <div className="stat"><div className="k">PIDs</div><div className="v">${stats.pids}<small>/ 256</small></div></div>
          <div className="stat"><div className="k">Restarts</div><div className="v">${CTR.restarts}<small>${CTR.restartPolicy}</small></div></div>
        </div>

        <${Tabs} activeKey=${tab} onChange=${setTab} items=${tabs.map(t => ({ key: t.key, label: t.label }))}
          style=${{ marginBottom: -1 }} />
      </div>

      <div className="page">
        ${tabs.find(t => t.key === tab).children}
      </div>
    </div>`;
}

/* ---------- shell ---------- */
const NAV = [
  { key: 'containers', label: 'Containers', hint: '7', icon: ContainerOutlined },
  { key: 'images', label: 'Images', hint: '6', icon: PictureOutlined },
  { key: 'volumes', label: 'Volumes', hint: '5', icon: HddOutlined },
  { key: 'prefs', label: 'Preferences', hint: '', icon: SettingOutlined },
];

function Shell() {
  return html`
    <div className="app">
      <aside className="side">
        <div className="brand"><${Glyph} />Container GUI</div>
        ${NAV.map(n => html`
          <div key=${n.key} className=${'nav-item' + (n.key === 'containers' ? ' active' : '')}>
            <${n.icon} style=${{ fontSize: 14, color: n.key === 'containers' ? '#e4f222' : '#62666d' }} />
            <span style=${{ flex: 1 }}>${n.label}</span>
            ${n.hint && html`<span className="mono dim">${n.hint}</span>`}
          </div>`)}
        <div className="side-foot">
          <span className="mono">desktop-linux</span>
          <span style=${{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style=${{ width: 6, height: 6, borderRadius: 99, background: '#27a644' }}></span>
            <span className="mono">7ms</span>
          </span>
        </div>
      </aside>

      <main className="main">
        <${ContainerDetail} />
      </main>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  html`<${ConfigProvider} theme=${themeCfg}><${AntApp}><${Shell} /><//><//>`
);
</script>
</body>
</html>
