# Follows the official Rust Style Guide (rustfmt defaults) plus nightly import
# grouping/merging options (`cargo +nightly fmt`).
# Reference: https://rust-lang.github.io/rustfmt/

# Pin both so bare `rustfmt` (IDE format-on-save) matches `cargo fmt`, which
# otherwise infers the style edition from Cargo.toml while rustfmt defaults to 2015.
edition = "2024"
style_edition = "2024"

# Matches .gitattributes / .editorconfig (LF everywhere).
newline_style = "Unix"

# Rewrite `Foo { x: x }` -> `Foo { x }` and `try!(e)` -> `e?`
# (same as clippy's redundant_field_names / the 2018+ idiom).
use_field_init_shorthand = true
use_try_shorthand = true

# Nightly-only: group imports into std, external crates, and local crate/super/self,
# and merge imports from the same module into a single `use` statement.
group_imports = "StdExternalCrate"
imports_granularity = "Module"
